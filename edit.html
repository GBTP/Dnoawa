<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>编辑谱面 · Anoawa 社区</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Anoawa <small>社区</small></a>
      <nav class="top-actions">
        <a class="top-link" href="index.html">谱面库</a>
        <a class="top-link" href="upload.html">上传</a>
        <a class="top-link" href="user.html">我的空间</a>
        <a class="top-link" href="get.html">获取游戏</a>
        <button class="top-link" type="button" id="logout">退出</button>
      </nav>
    </div>
  </header>

  <main class="page" style="max-width:760px">
    <p class="result-meta" id="back"></p>
    <div id="content"></div>
  </main>

  <script type="module">
    import { requireLogin, describeError, logout, ApiError } from './js/api.js';
    import {
      getLevel, updateLevel, deleteLevel,
      createLevelTransfer, revokeLevelTransfer,
      inviteCollaborator, updateCollaboratorRole, removeCollaborator,
    } from './js/levels.js';
    import { getMyProfile } from './js/users.js';
    import {
      el, clear, showBox, hideBox, commandBlock, formatDate, displayName, avatarImage,
    } from './js/ui.js';
    import { RESOURCE_KINDS, uploadResource } from './js/replace.js';
    import { decodeAudio, defaultPreviewRange } from './js/media.js';
    import { createPreviewRangeEditor } from './js/preview-range.js';

    if (!requireLogin()) throw new Error('redirecting');
    document.getElementById('logout').addEventListener('click', logout);

    const content = document.getElementById('content');
    const levelId = new URLSearchParams(location.search).get('id');

    if (!levelId || !/^\d+$/.test(levelId)) {
      renderError('链接不完整', '缺少谱面编号。');
    } else {
      load(levelId);
    }

    async function load(id) {
      document.getElementById('back').append(
        el('a', { href: `level.html?id=${id}` }, '← 返回谱面详情'));
      content.append(el('div', { class: 'skeleton', style: 'height:320px' }));

      let level, profile;
      try {
        [level, profile] = await Promise.all([getLevel(id), getMyProfile()]);
      } catch (error) {
        clear(content);
        if (error instanceof ApiError && error.status === 403) {
          renderError('无权访问', '这张谱面对你不可见。');
        } else if (error instanceof ApiError && error.isGone) {
          renderError('谱面不存在', '它可能已被删除。');
        } else {
          renderError('加载失败', describeError(error));
        }
        return;
      }

      // 后端 UpdateLevelAsync 的权限判断是 UploaderId == requesterId || isAdmin，
      // 这里先挡一道，省得填完表单才被 403
      const canEdit = level.uploaderId === profile.id || profile.isAdmin;
      if (!canEdit) {
        clear(content);
        renderError('无权编辑', '只有上传者和管理员可以修改这张谱面。');
        return;
      }

      clear(content);
      renderForm(level, profile.isAdmin);
    }

    function renderForm(level, isAdmin) {
      document.title = `编辑 ${level.levelName} · Anoawa 社区`;

      const form = el('form', { class: 'card' });
      const fields = {};
      const input = (id, label, value, attrs = {}, hint = null) => {
        const node = el('input', { class: 'input', value: value ?? '', ...attrs });
        fields[id] = node;
        return el('div', { class: 'field' },
          el('label', {}, label), node,
          hint ? el('p', { class: 'hint' }, hint) : null);
      };

      // 非管理员改完要重审，这条必须显眼——否则谱师会以为改个错别字
      // 就把自己的谱面从库里弄消失了
      if (!isAdmin) {
        form.append(el('div', { class: 'callout warning' },
          el('strong', {}, '保存后需要重新审核。'),
          el('p', {}, '修改会把谱面状态改回「审核中」，通过前其他玩家看不到它。'),
        ));
      }

      form.append(
        el('div', { class: 'grid-2' },
          input('levelName', '曲名', level.levelName, { required: true, maxlength: '80' }),
          input('composerName', '曲师', level.composerName, { required: true, maxlength: '80' }),
          input('charterName', '谱师', level.charterName, { required: true, maxlength: '80' }),
          input('artistName', '曲绘', level.artistName, { required: true, maxlength: '80' }),
          input('displayDifficulty', '显示难度', level.displayDifficulty, { required: true, maxlength: '16' }),
          input('baseBpm', '基准 BPM', level.baseBpm, { type: 'number', step: '0.01', min: '1', required: true }, '参与玩法的数值。'),
          input('bpm', '显示 BPM', level.bpm, { maxlength: '32' }, '纯展示，可写成 174-186。'),
        ),
      );

      const themeText = el('input', {
        class: 'input', value: level.themeColor || '#4B65B0',
        maxlength: '7', pattern: '#[0-9A-Fa-f]{6}',
      });
      const themeSwatch = el('input', { class: 'input swatch', type: 'color', value: safeColor(level.themeColor), 'aria-label': '选择主题色' });
      themeText.addEventListener('input', () => {
        if (/^#[0-9a-f]{6}$/i.test(themeText.value)) themeSwatch.value = themeText.value;
      });
      themeSwatch.addEventListener('input', () => { themeText.value = themeSwatch.value.toUpperCase(); });
      fields.themeColor = themeText;

      const tags = el('input', { class: 'input', value: (level.tags || []).join(', '), placeholder: '用逗号分隔' });
      const intro = el('textarea', { class: 'input', rows: '3', maxlength: '500' });
      intro.value = level.introduction || '';
      const allowExport = el('input', { type: 'checkbox' });
      allowExport.checked = Boolean(level.allowExport);

      form.append(
        el('div', { class: 'field' },
          el('label', {}, '主题色'),
          el('div', { class: 'input-row' }, themeText, themeSwatch)),
        el('div', { class: 'field' }, el('label', {}, '标签'), tags),
        el('div', { class: 'field' }, el('label', {}, '简介'), intro),
        el('div', { class: 'field' },
          el('label', { class: 'check' }, allowExport,
            el('span', {}, '允许其他玩家把下载后的谱面导出成文件夹')),
        ),
      );

      const save = el('button', { class: 'button primary', type: 'submit' }, '保存修改');
      const status = el('div', { class: 'callout', hidden: true });
      form.append(el('div', { class: 'hero-actions' }, save), status);

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        hideBox(status);
        save.disabled = true;
        save.textContent = '保存中…';

        try {
          // 只提交真正改过的字段：后端对每个字段判 `is not null`，
          // 全量提交在并发编辑时会把别人刚改的覆盖掉
          const patch = {};
          const put = (key, value, original) => {
            if (value !== original) patch[key] = value;
          };

          put('levelName', fields.levelName.value.trim(), level.levelName);
          put('composerName', fields.composerName.value.trim(), level.composerName);
          put('charterName', fields.charterName.value.trim(), level.charterName);
          put('artistName', fields.artistName.value.trim(), level.artistName);
          put('displayDifficulty', fields.displayDifficulty.value.trim(), level.displayDifficulty);
          put('baseBpm', Number(fields.baseBpm.value) || 0, level.baseBpm);
          put('bpm', fields.bpm.value.trim(), level.bpm ?? '');
          put('themeColor', /^#[0-9a-f]{6}$/i.test(themeText.value) ? themeText.value : '#4B65B0', level.themeColor);
          put('introduction', intro.value.trim(), level.introduction ?? '');
          put('allowExport', allowExport.checked, Boolean(level.allowExport));

          const nextTags = tags.value.split(/[,，]/).map(t => t.trim()).filter(Boolean);
          const oldTags = level.tags || [];
          if (nextTags.length !== oldTags.length || nextTags.some((t, i) => t !== oldTags[i])) {
            patch.tags = nextTags;
          }

          if (!Object.keys(patch).length) {
            showBox(status, '没有需要保存的改动', '');
            return;
          }

          await updateLevel(level.id, patch);
          showBox(status, isAdmin ? '已保存。' : '已保存，谱面重新进入审核队列。', 'success');
          setTimeout(() => location.href = `level.html?id=${level.id}`, 1200);
        } catch (error) {
          showBox(status, describeError(error), 'error');
        } finally {
          save.disabled = false;
          save.textContent = '保存修改';
        }
      });

      content.append(form);
      content.append(resourceSection(level, isAdmin));
      content.append(collaboratorSection(level));
      content.append(transferSection(level));
      content.append(dangerZone(level));
    }

    /**
     * 逐个资源替换。后端的五个 *FileId 都是独立可选的，所以这里一次只换一样，
     * 不用像客户端那样凑齐整个目录。
     */
    function resourceSection(level, isAdmin) {
      const box = el('div', { class: 'resource-section' },
        el('h2', { class: 'section-title' }, '替换资源'));

      if (!isAdmin) {
        box.append(el('p', { class: 'hint', style: 'margin:-6px 0 16px' },
          '换任何一项都会让谱面重新进入审核，并让已下载的玩家重新下载。'));
      }

      const rows = el('div', { class: 'resource-list' });

      for (const [kind, spec] of Object.entries(RESOURCE_KINDS)) {
        const picker = el('input', { type: 'file', accept: spec.accept, hidden: true });
        const choose = el('button', { class: 'button small', type: 'button' }, '选择文件');
        const chosen = el('span', { class: 'resource-file' }, '未选择');
        const apply = el('button', { class: 'button small', type: 'button', disabled: true }, '替换');
        const status = el('div', { class: 'resource-status' });
        // 只有预览用得上：选完文件后在这里画波形让用户框选区间
        const rangeSlot = kind === 'preview' ? el('div', { class: 'resource-range' }) : null;
        const hintSlot = el('div', { class: 'resource-extra' });
        let rangeEditor = null;

        const reset = () => {
          picker.value = '';
          chosen.textContent = '未选择';
          apply.disabled = true;
          rangeEditor?.destroy();
          rangeEditor = null;
          if (rangeSlot) clear(rangeSlot);
        };

        choose.addEventListener('click', () => picker.click());
        picker.addEventListener('change', async () => {
          const file = picker.files[0];
          chosen.textContent = file ? `${file.name}（${formatSize(file.size)}）` : '未选择';
          apply.disabled = !file;
          status.textContent = '';
          status.className = 'resource-status';
          clear(hintSlot);

          rangeEditor?.destroy();
          rangeEditor = null;
          if (!rangeSlot) return;
          clear(rangeSlot);
          if (!file) return;

          // 解码是上传前本来就要做的（切片用），这里提前做掉，画波形和试听不额外花成本
          status.textContent = '正在解析波形…';
          apply.disabled = true;
          try {
            const buffer = await decodeAudio(file);
            // 解码期间用户可能又换了文件，这份结果已经过期
            if (picker.files[0] !== file) return;

            const initial = defaultPreviewRange(buffer.duration);
            rangeEditor = createPreviewRangeEditor({ buffer, ...initial });
            rangeSlot.append(rangeEditor.element);
            status.textContent = '';
          } catch (error) {
            // 解析失败不挡住替换：整段上传这条路仍然可用（后端会拒超 60 秒的）
            status.textContent = `无法解析波形（${error.message}），将整段上传`;
          } finally {
            if (picker.files[0] === file) apply.disabled = false;
          }
        });

        apply.addEventListener('click', async () => {
          const file = picker.files[0];
          if (!file) return;
          if (spec.warn && !window.confirm(`${spec.warn}\n\n确定要替换${spec.label}吗？`)) return;

          apply.disabled = true;
          choose.disabled = true;
          try {
            const patch = await uploadResource(kind, file, text => {
              status.textContent = text;
              status.className = 'resource-status';
            }, { previewRange: rangeEditor?.getRange() });
            await updateLevel(level.id, patch);
            status.textContent = isAdmin ? '已替换。' : '已替换，谱面重新进入审核。';
            status.className = 'resource-status is-done';
            reset();
          } catch (error) {
            status.textContent = describeError(error);
            status.className = 'resource-status is-error';
            // 视频不合规时 prepareResource 会把 ffmpeg 命令挂在错误上，
            // 直接给出来比让用户自己查参数强
            if (error.ffmpegCommand) {
              clear(hintSlot);
              hintSlot.append(commandBlock(error.ffmpegCommand,
                '装了 ffmpeg 的话，用这条命令转成合规的 MP4 再上传：'));
            }
            apply.disabled = false;
          } finally {
            choose.disabled = false;
          }
        });

        rows.append(el('div', { class: 'resource-row' },
          el('div', { class: 'resource-head' },
            el('strong', {}, spec.label),
            el('span', { class: 'resource-hint' }, spec.hint)),
          el('div', { class: 'resource-actions' }, choose, chosen, apply, picker),
          rangeSlot,
          status,
          hintSlot,
        ));
      }

      box.append(rows);
      return box;
    }

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    /**
     * 合作者挂名。**纯署名，没有编辑权限**——这一点必须写在界面上，
     * 否则会有人以为挂名了就能一起改谱面。要真的交出控制权得用下面的转让。
     *
     * 邀请按身份 id（UID）定位对方，需要对方确认后才会出现在署名里。
     */
    function collaboratorSection(level) {
      const box = el('div', { class: 'collab-section' },
        el('h2', { class: 'section-title' }, '合作者'));
      const body = el('div', {});
      box.append(body);

      render(level.collaborators ?? []);

      function render(list) {
        clear(body);

        body.append(el('p', { class: 'hint', style: 'margin-top:0' },
          '给参与制作的人挂名，会显示在谱面详情里。挂名只是署名，' +
          '不会给对方编辑、替换资源或删除的权限。'));

        if (list.length) {
          const rows = el('div', { class: 'collab-list' });
          for (const person of list) rows.append(collabRow(person));
          body.append(rows);
        }

        body.append(inviteForm());
      }

      function collabRow(person) {
        const row = el('div', { class: 'collab-row' });
        const status = el('div', { class: 'callout', hidden: true });

        const role = el('input', { class: 'input', value: person.role || '', maxlength: '24' });
        const save = el('button', { class: 'button small', type: 'button' }, '改分工');
        const remove = el('button', { class: 'button small ghost', type: 'button' }, '移除');

        save.addEventListener('click', async () => {
          if (!role.value.trim()) return;
          save.disabled = true;
          try {
            await updateCollaboratorRole(level.id, person.profileId, role.value);
            showBox(status, '已更新。', 'success');
          } catch (error) {
            showBox(status, describeError(error), 'error');
          } finally {
            save.disabled = false;
          }
        });

        remove.addEventListener('click', async () => {
          if (!window.confirm(`移除「${displayName(person.nickname, person.isAnonymized)}」的挂名？`)) return;
          remove.disabled = true;
          try {
            await removeCollaborator(level.id, person.profileId);
            row.remove();
          } catch (error) {
            showBox(status, describeError(error), 'error');
            remove.disabled = false;
          }
        });

        row.append(
          el('div', { class: 'collab-who' },
            avatarImage(person.isAnonymized ? null : person.avatarUrl,
              displayName(person.nickname, person.isAnonymized),
              { size: 96, className: 'avatar avatar-sm' }),
            el('div', {},
              el('strong', {}, displayName(person.nickname, person.isAnonymized)),
              el('span', { class: 'num' }, `UID ${person.profileId}`)),
          ),
          el('div', { class: 'collab-actions' }, role, save, remove),
          status,
        );
        return row;
      }

      function inviteForm() {
        const uid = el('input', { class: 'input', type: 'number', min: '1', placeholder: '对方的 UID' });
        const role = el('input', { class: 'input', maxlength: '24', placeholder: '分工，如 曲绘 / BGA / 测试' });
        const submit = el('button', { class: 'button', type: 'button' }, '发出邀请');
        const status = el('div', { class: 'callout', hidden: true });

        submit.addEventListener('click', async () => {
          hideBox(status);
          if (!uid.value.trim() || !role.value.trim()) {
            return showBox(status, '请填写对方 UID 和分工', 'error');
          }
          submit.disabled = true;
          submit.textContent = '发送中…';
          try {
            await inviteCollaborator(level.id, uid.value, role.value);
            uid.value = '';
            role.value = '';
            showBox(status, '邀请已发出，对方确认后才会出现在署名里。', 'success');
          } catch (error) {
            showBox(status, describeError(error), 'error');
          } finally {
            submit.disabled = false;
            submit.textContent = '发出邀请';
          }
        });

        return el('div', { class: 'collab-invite' },
          el('span', { class: 'label' }, '邀请合作者'),
          el('p', { class: 'hint' },
            '填对方的 UID——在对方的个人空间页面能看到。邀请发出后要等他自己确认。'),
          el('div', { class: 'collab-invite-row' }, uid, role, submit),
          status,
        );
      }

      return box;
    }

    /**
     * 转让所有权。用于多人合作时在成员之间移交，也用于代传后交还作者。
     *
     * 上传者就是所有者，所以转让之后自己对这张谱面的编辑、替换、删除权限
     * 立刻消失——文案上必须写死这一点。
     */
    function transferSection(level) {
      const box = el('div', { class: 'transfer-section' },
        el('h2', { class: 'section-title' }, '转让所有权'));

      const status = el('div', { class: 'callout', hidden: true });
      const codeSlot = el('div', {});

      const generate = el('button', { class: 'button', type: 'button' }, '生成转让码');
      const revoke = el('button', { class: 'button ghost', type: 'button' }, '撤销未领取的码');

      generate.addEventListener('click', async () => {
        if (!window.confirm(
          `生成「${level.levelName}」的转让码？\n\n` +
          '对方领取后这张谱面就归他所有，你将无法再编辑、替换资源或删除它。'
        )) return;

        hideBox(status);
        generate.disabled = true;
        generate.textContent = '生成中…';
        try {
          const result = await createLevelTransfer(level.id);
          clear(codeSlot);
          codeSlot.append(commandBlock(result.code,
            `把这串码发给对方，${formatDate(result.expiresAtUtc)}过期。` +
            '它只显示这一次，关掉页面就看不到了；重新生成会作废这一个。'));
          generate.textContent = '重新生成';
        } catch (error) {
          showBox(status, describeError(error), 'error');
          generate.textContent = '生成转让码';
        } finally {
          generate.disabled = false;
        }
      });

      revoke.addEventListener('click', async () => {
        hideBox(status);
        revoke.disabled = true;
        try {
          await revokeLevelTransfer(level.id);
          clear(codeSlot);
          showBox(status, '已撤销。之前发出的码不再有效。', 'success');
          generate.textContent = '生成转让码';
        } catch (error) {
          showBox(status, describeError(error), 'error');
        } finally {
          revoke.disabled = false;
        }
      });

      box.append(
        el('p', { class: 'hint', style: 'margin-top:0' },
          '生成一串码交给对方，对方领取后这张谱面就归他所有——包括编辑、替换资源和删除的权限。' +
          '多人合作时用它在成员之间移交，代传时用它把作品交还作者。'),
        el('div', { class: 'hero-actions', style: 'margin-top:14px' }, generate, revoke),
        codeSlot,
        status,
      );
      return box;
    }

    /** 删除是不可逆的，单独放一块并要求输入曲名确认。 */
    function dangerZone(level) {
      const box = el('div', { class: 'danger-zone' });
      const confirm = el('input', { class: 'input', placeholder: '输入曲名以确认删除' });
      const remove = el('button', { class: 'button danger', type: 'button', disabled: true }, '删除这张谱面');
      const status = el('div', { class: 'callout', hidden: true });

      confirm.addEventListener('input', () => {
        remove.disabled = confirm.value.trim() !== level.levelName;
      });

      remove.addEventListener('click', async () => {
        remove.disabled = true;
        remove.textContent = '删除中…';
        try {
          await deleteLevel(level.id);
          location.href = 'user.html';
        } catch (error) {
          showBox(status, describeError(error), 'error');
          remove.disabled = false;
          remove.textContent = '删除这张谱面';
        }
      });

      box.append(
        el('h2', { class: 'section-title' }, '危险操作'),
        el('div', { class: 'callout error' },
          el('strong', {}, '删除后无法恢复。'),
          el('p', {}, '谱面文件、所有人在这张谱面上的成绩和点赞都会一并删除。'),
        ),
        el('div', { class: 'field', style: 'margin-top:16px' }, confirm),
        remove,
        status,
      );
      return box;
    }

    function safeColor(value) {
      return /^#[0-9a-f]{6}$/i.test(value || '') ? value : '#4B65B0';
    }

    function renderError(title, detail) {
      clear(content);
      content.append(el('div', { class: 'card' },
        el('div', { class: 'empty' },
          el('h3', {}, title),
          el('p', {}, detail),
          el('p', { style: 'margin-top:16px' }, el('a', { href: 'index.html' }, '← 返回谱面库')),
        ),
      ));
    }
  </script>
</body>
</html>
