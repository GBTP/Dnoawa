<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>编辑谱面 · Anoawa 社区</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Anoawa <small>社区</small></a>
      <nav class="top-actions">
        <a class="top-link" href="index.html">谱面库</a>
        <a class="top-link" href="upload.html">上传</a>
        <a class="top-link" href="user.html">我的空间</a>
        <a class="top-link" href="get.html">获取游戏</a>
        <button class="top-link" type="button" id="logout">退出</button>
      </nav>
    </div>
  </header>

  <main class="page" style="max-width:760px">
    <p class="result-meta" id="back"></p>
    <div id="content"></div>
  </main>

  <script type="module" src="js/nav.js"></script>
  <script type="module">
    import { requireLogin, describeError, logout, ApiError } from './js/api.js';
    import {
      getLevel, updateLevel, deleteLevel,
      createLevelTransfer, revokeLevelTransfer,
      inviteCollaborator, updateCollaboratorRole, removeCollaborator,
    } from './js/levels.js';
    import { getMyProfile, searchUsers, MIN_SEARCH_LENGTH } from './js/users.js';
    import { elevate, needsElevate } from './js/profiles.js';
    import {
      el, clear, showBox, hideBox, commandBlock, formatDate, displayName, avatarImage,
      copyableValue,
    } from './js/ui.js';
    import { uploadFile } from './js/tus.js';
    import { prepareChartPackage, uploadResource, buildFfmpegCommand } from './js/replace.js';
    import { fetchBinary, decodeAudio, defaultPreviewRange, probeVideo } from './js/media.js';
    import { createPreviewPlayer } from './js/audio.js';
    import { openChartPackage } from './js/chart-package.js';
    import { analyzeSfx } from './js/aff.js';
    import { createResourceRow, createFilePicker, formatResourceSize, thumbImage } from './js/resource-editor.js';
    import { createPreviewRangeEditor } from './js/preview-range.js';

    if (!requireLogin()) throw new Error('redirecting');
    document.getElementById('logout').addEventListener('click', logout);

    const content = document.getElementById('content');
    const levelId = new URLSearchParams(location.search).get('id');

    if (!levelId || !/^\d+$/.test(levelId)) {
      renderError('链接不完整', '缺少谱面编号。');
    } else {
      load(levelId);
    }

    async function load(id) {
      document.getElementById('back').append(
        el('a', { href: `level.html?id=${id}` }, '← 返回谱面详情'));
      content.append(el('div', { class: 'skeleton', style: 'height:320px' }));

      let level, profile;
      try {
        [level, profile] = await Promise.all([getLevel(id), getMyProfile()]);
      } catch (error) {
        clear(content);
        if (error instanceof ApiError && error.status === 403) {
          renderError('无权访问', '这张谱面对你不可见。');
        } else if (error instanceof ApiError && error.isGone) {
          renderError('谱面不存在', '它可能已被删除。');
        } else {
          renderError('加载失败', describeError(error));
        }
        return;
      }

      // 后端 UpdateLevelAsync 的权限判断是 UploaderId == requesterId || isAdmin，
      // 这里先挡一道，省得填完表单才被 403
      const canEdit = level.uploaderId === profile.id || profile.isAdmin;
      if (!canEdit) {
        clear(content);
        renderError('无权编辑', '只有上传者和管理员可以修改这张谱面。');
        return;
      }

      clear(content);
      renderForm(level, profile.isAdmin);
    }

    /**
     * 不可逆操作（删除、生成转让码）需要 accountToken，后端整个
     * LevelOwnershipController 都要求 AccountPolicy。accountToken 只放内存、
     * 1 小时过期，所以这里按需索取：没有就弹密码框换一张。
     *
     * @returns {Promise<boolean>} 拿到凭据返回 true，用户取消或验证失败返回 false
     */
    async function ensureElevated(reason) {
      if (!needsElevate()) return true;

      const password = window.prompt(
        `${reason}\n\n这是不可逆的操作，请输入账号密码确认：`);
      if (!password) return false;

      try {
        await elevate(password);
        return true;
      } catch (error) {
        alert(describeError(error));
        return false;
      }
    }

    function renderForm(level, isAdmin) {
      document.title = `编辑 ${level.levelName} · Anoawa 社区`;

      const form = el('form', { class: 'card' });
      const fields = {};
      const input = (id, label, value, attrs = {}, hint = null) => {
        const node = el('input', { class: 'input', value: value ?? '', ...attrs });
        fields[id] = node;
        return el('div', { class: 'field' },
          el('label', {}, label), node,
          hint ? el('p', { class: 'hint' }, hint) : null);
      };

      // 非管理员改完要重审，这条必须显眼——否则谱师会以为改个错别字
      // 就把自己的谱面从库里弄消失了
      if (!isAdmin) {
        form.append(el('div', { class: 'callout warning' },
          el('strong', {}, '保存后需要重新审核。'),
          el('p', {}, '修改会把谱面状态改回「审核中」，通过前其他玩家看不到它。'),
        ));
      }

      form.append(
        el('div', { class: 'grid-2' },
          input('levelName', '曲名', level.levelName, { required: true, maxlength: '80' }),
          input('composerName', '曲师', level.composerName, { required: true, maxlength: '80' }),
          input('charterName', '谱师', level.charterName, { required: true, maxlength: '80' }),
          input('artistName', '曲绘', level.artistName, { required: true, maxlength: '80' }),
          input('displayDifficulty', '显示难度', level.displayDifficulty, { required: true, maxlength: '16' }),
          input('chartConstant', '难度定数', level.chartConstant, { type: 'number', step: '0.1', min: '0', max: '20' }, '清空不会撤销已有定数，只是这次不改它。'),
          input('baseBpm', '基准 BPM', level.baseBpm, { type: 'number', step: '0.01', min: '1', required: true }, '参与玩法的数值。'),
          input('bpm', '显示 BPM', level.bpm, { maxlength: '32' }, '纯展示，可写成 174-186。'),
        ),
      );

      const themeText = el('input', {
        class: 'input', value: level.themeColor || '#4B65B0',
        maxlength: '7', pattern: '#[0-9A-Fa-f]{6}',
      });
      const themeSwatch = el('input', { class: 'input swatch', type: 'color', value: safeColor(level.themeColor), 'aria-label': '选择主题色' });
      themeText.addEventListener('input', () => {
        if (/^#[0-9a-f]{6}$/i.test(themeText.value)) themeSwatch.value = themeText.value;
      });
      themeSwatch.addEventListener('input', () => { themeText.value = themeSwatch.value.toUpperCase(); });
      fields.themeColor = themeText;

      const theme = el('select', { class: 'select' });
      for (const [value, label] of [['', '不指定'], ['Light', '明亮'], ['Dark', '暗色']]) {
        const option = el('option', { value }, label);
        // 后端出的是枚举名（Unspecified/Light/Dark），Unspecified 对应"不指定"那个空值
        if ((level.recommendedTheme || 'Unspecified') === (value || 'Unspecified')) option.selected = true;
        theme.append(option);
      }

      const tags = el('input', { class: 'input', value: (level.tags || []).join(', '), placeholder: '用逗号分隔' });
      const intro = el('textarea', { class: 'input', rows: '3', maxlength: '500' });
      intro.value = level.introduction || '';

      form.append(
        el('div', { class: 'field' },
          el('label', {}, '主题色'),
          el('div', { class: 'input-row' }, themeText, themeSwatch)),
        el('div', { class: 'field' },
          el('label', {}, '推荐资源包主题'), theme,
          el('p', { class: 'hint' }, '建议玩这张谱时用哪种色调的资源包，纯建议。')),
        el('div', { class: 'field' }, el('label', {}, '标签'), tags),
        el('div', { class: 'field' }, el('label', {}, '简介'), intro),
      );

      // 保存按钮和状态栏不在 form 内：资源清单是和字段同一次提交的另一块面板，
      // 把保存入口放在它之后才顺。按钮用 requestSubmit 触发 form 的 submit，
      // 照样走 reportValidity；按钮在 form 外，不会因为回车误触提交。
      const save = el('button', { class: 'button primary', type: 'submit' }, '保存修改');
      const status = el('div', { class: 'callout', hidden: true });
      save.addEventListener('click', () => form.requestSubmit());

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        hideBox(status);
        save.disabled = true;
        save.textContent = '保存中…';

        try {
          // 只提交真正改过的字段：后端对每个字段判 `is not null`，
          // 全量提交在并发编辑时会把别人刚改的覆盖掉
          const patch = {};
          const put = (key, value, original) => {
            if (value !== original) patch[key] = value;
          };

          put('levelName', fields.levelName.value.trim(), level.levelName);
          put('composerName', fields.composerName.value.trim(), level.composerName);
          put('charterName', fields.charterName.value.trim(), level.charterName);
          put('artistName', fields.artistName.value.trim(), level.artistName);
          put('displayDifficulty', fields.displayDifficulty.value.trim(), level.displayDifficulty);
          put('baseBpm', Number(fields.baseBpm.value) || 0, level.baseBpm);
          put('bpm', fields.bpm.value.trim(), level.bpm ?? '');
          put('themeColor', /^#[0-9a-f]{6}$/i.test(themeText.value) ? themeText.value : '#4B65B0', level.themeColor);
          put('introduction', intro.value.trim(), level.introduction ?? '');
          put('recommendedTheme', theme.value || 'Unspecified', level.recommendedTheme || 'Unspecified');

          // 定数留空 = 这次不改。后端 UpdateLevelRequest.ChartConstant 是 float?，
          // null 就是"不动"，没有"清成未设定"这条路——真要清得另开接口，先不做。
          const constantText = fields.chartConstant.value.trim();
          if (constantText !== '' && Number(constantText) !== level.chartConstant) {
            patch.chartConstant = Number(constantText);
          }

          const nextTags = tags.value.split(/[,，]/).map(t => t.trim()).filter(Boolean);
          const oldTags = level.tags || [];
          if (nextTags.length !== oldTags.length || nextTags.some((t, i) => t !== oldTags[i])) {
            patch.tags = nextTags;
          }

          if (resources.hasChanges()) {
            const resourcePatch = await resources.preparePatch(text => {
              status.textContent = text;
              status.className = 'callout';
            });
            Object.assign(patch, resourcePatch);
          }

          if (!Object.keys(patch).length) {
            showBox(status, '没有需要保存的改动', '');
            return;
          }

          await updateLevel(level.id, patch);
          resources.commit();
          showBox(status, isAdmin ? '已保存。' : '已保存，谱面重新进入审核队列。', 'success');
          setTimeout(() => location.href = `level.html?id=${level.id}`, 1200);
        } catch (error) {
          showBox(status, describeError(error), 'error');
        } finally {
          save.disabled = false;
          save.textContent = '保存修改';
        }
      });

      const resources = resourceSection(level, isAdmin);
      // 统一保存栏：信息和资源是同一次 updateLevel 提交，保存入口放在两块面板之后，
      // 不用再从资源面板滚回顶部找按钮。合作者/转让/删除是各自独立的提交，仍在后面分开。
      const saveBar = el('div', { class: 'save-bar card' },
        el('div', { class: 'hero-actions' }, save),
        status);
      content.append(form);
      content.append(resources);
      content.append(saveBar);
      content.append(collaboratorSection(level));
      content.append(transferSection(level));
      content.append(dangerZone(level));
    }

    /**
     * 资源清单。独立资源和包内资源都先放进 draft，顶部的「保存修改」一次提交。
     */
    function resourceSection(level, isAdmin) {
      const box = el('div', { class: 'resource-section' },
        el('h2', { class: 'section-title' }, '资源清单'),
        el('p', { class: 'hint', style: 'margin:-6px 0 16px' },
          isAdmin ? '可以逐项替换或删除，最后和上面的信息一起点击「保存修改」。' :
            '可以逐项替换或删除；所有改动会在一次保存时提交，保存后谱面会重新进入审核。'));
      const rows = el('div', { class: 'resource-list' });
      const summary = el('div', { class: 'upload-summary' });
      const status = el('div', { class: 'callout', hidden: true });
      const packageNote = el('div', { class: 'resource-status' }, '正在读取谱面里的资源…');
      let packageModel = null;
      let packageError = null;
      let packageDirty = false;
      let packageAnalysis = null;
      let packageLoading = true;
      let rangeEditor = null;
      let rangeDirty = false;
      let musicSource = null;
      let musicSequence = 0;
      let videoProbe = null;
      let analysisSequence = 0;
      let objectUrls = [];
      const draft = { cover: null, music: null, video: null, removeVideo: false };
      let previewRange = { start: level.previewStart || 0, end: level.previewEnd || 0 };

      box.append(summary, rows, status);
      renderRows();
      loadPackage();

      async function loadPackage() {
        try {
          const bytes = await fetchBinary(level.chartPackageUrl, {
            onProgress: ratio => { packageNote.textContent = `正在读取谱面资源 ${Math.round(ratio * 100)}%`; },
          });
          packageModel = await openChartPackage(bytes);
          packageAnalysis = analyzeSfx(new TextDecoder().decode(packageModel.chart.data), packageModel.sfx);
          packageLoading = false;
          renderRows();
        } catch (error) {
          packageLoading = false;
          packageError = error;
          packageNote.textContent = `无法读取谱面资源：${error.message}`;
          packageNote.className = 'resource-status is-error';
          renderRows();
        }
      }

      function localUrl(blob) {
        const url = URL.createObjectURL(blob);
        objectUrls.push(url);
        return url;
      }

      async function refreshPackageAnalysis() {
        if (!packageModel?.chart) return;
        const sequence = ++analysisSequence;
        try {
          const data = packageModel.chart.data || new Uint8Array(await packageModel.chart.file.arrayBuffer());
          const next = analyzeSfx(new TextDecoder().decode(data), packageModel.sfx);
          if (sequence !== analysisSequence) return;
          packageAnalysis = next;
          renderRows();
        } catch {
          packageAnalysis = null;
        }
      }

      function mediaNode(url, kind) {
        if (!url) return null;
        if (kind === 'cover') return thumbImage('cover', url, '当前封面');
        // 不能用裸 <audio>：CDN 给这些文件返回的是非标准 MIME audio/x-vorbis+ogg，
        // 严格 MIME 的浏览器会以为自己能播然后卡住；Safari 干脆不支持 Vorbis。
        // 详情页的 createPreviewPlayer 先挂原生、出错再换 WASM 解码器，复用它
        if (kind === 'music' || kind === 'preview') return createPreviewPlayer(url);
        if (kind === 'video') return el('video', { controls: true, preload: 'metadata', src: url });
        return null;
      }

      function fileOrCurrent(file, currentName) {
        return file || { name: currentName };
      }

      function updateResourceSummary() {
        clear(summary);
        const changes = [];
        if (draft.cover) changes.push('替换封面');
        if (draft.music) changes.push('替换音乐');
        if (rangeDirty) changes.push('调整预览区间');
        if (draft.video) changes.push('替换背景视频');
        if (draft.removeVideo) changes.push('删除背景视频');
        if (packageDirty) changes.push('修改谱面内资源');
        summary.textContent = changes.length ? `待保存：${changes.join('、')}` : '尚未选择资源改动';
      }

      function renderRows() {
        objectUrls.forEach(url => URL.revokeObjectURL(url));
        objectUrls = [];
        clear(rows);
        updateResourceSummary();

        appendIndependent('cover', '封面', '当前封面。', 'image/*', level.coverUrl, draft.cover, true);
        appendIndependent('music', '音乐', '当前音乐；换音乐后会自动重算预览片段。', 'audio/*,.ogg,.mp3,.wav,.flac', level.musicUrl, draft.music, true);
        appendPreview();
        appendVideo();

        if (packageLoading) {
          rows.append(el('div', { class: 'resource-row' }, packageNote));
        } else if (packageError) {
          rows.append(el('div', { class: 'resource-row' }, packageNote));
        } else {
          appendPackageRows();
        }
      }

      function appendIndependent(kind, label, hint, accept, currentUrl, selected, required) {
        const row = createResourceRow({
          label, hint, required, accept,
          value: fileOrCurrent(selected, `当前${label}`),
          preview: selected ? mediaNode(localUrl(selected), kind) : mediaNode(currentUrl, kind),
          onChoose: async files => {
            const file = files[0];
            if (!file) return;
            draft[kind] = file;
            // 解码失败不能静默——用户选了文件却看不到任何反馈会以为页面坏了
            try {
              if (kind === 'music') await prepareMusicRange(file, true);
            } catch (error) {
              showBox(status, `无法解析新音乐：${error.message}，保存时将按原区间截取`, 'error');
            }
            renderRows();
          },
        });
        rows.append(row.element);
      }

      function appendPreview() {
        const row = el('div', { class: 'resource-row' });
        const slot = el('div', { class: 'resource-range' });
        const adjust = el('button', { class: 'button small', type: 'button' }, '调整区间');
        adjust.addEventListener('click', async () => {
          try {
            const source = draft.music || await ensureMusicSource(text => { status.hidden = false; status.textContent = text; });
            await prepareMusicRange(source, false);
          } catch (error) { showBox(status, describeError(error), 'error'); }
        });
        row.append(...[
          el('div', { class: 'resource-head' }, el('strong', {}, '预览音频'), el('span', { class: 'resource-hint' }, '从当前音乐自动截取，最长 60 秒；更换音乐后会自动重算，也可以只移动起止位置。')),
          mediaNode(level.previewUrl, 'preview'),
          el('div', { class: 'resource-actions' }, adjust),
          slot,
        ].filter(Boolean));
        if (rangeEditor) slot.append(rangeEditor.element);
        rows.append(row);
      }

      function appendVideo() {
        const current = draft.video || (level.videoUrl && !draft.removeVideo ? { name: '当前背景视频' } : null);
        const row = createResourceRow({
          label: '背景视频', hint: '可选的 BGA；移除后会恢复为无视频。', accept: 'video/mp4,.mp4', value: current,
          preview: draft.video ? mediaNode(localUrl(draft.video), 'video') : mediaNode(draft.removeVideo ? null : level.videoUrl, 'video'),
          onChoose: async files => {
            if (!files[0]) return;
            draft.video = files[0];
            draft.removeVideo = false;
            videoProbe = await probeVideo(files[0]);
            renderRows();
          },
          onRemove: () => { draft.video = null; draft.removeVideo = Boolean(level.videoUrl); videoProbe = null; renderRows(); },
          extra: videoProbe && !videoProbe.ok ? () => el('div', { class: 'callout warning' }, videoProbe.reason, commandBlock(buildFfmpegCommand(draft.video?.name || 'input.mp4'), '用这条命令转码后再选择合规文件：')) : null,
        });
        rows.append(row.element);
      }

      function appendPackageRows() {
        const model = packageModel;
        const chartRow = createResourceRow({
          label: '谱面', hint: '当前 ZIP 里的 chart.aff。替换后会保留其他未识别条目。', accept: '.aff,.zip',
          value: model.chart, onChoose: async files => {
            const file = files[0];
            if (!file) return;
            if (file.name.toLowerCase().endsWith('.zip')) {
              try { packageModel = await openChartPackage(new Uint8Array(await file.arrayBuffer())); }
              catch (error) { showBox(status, error.message, 'error'); return; }
            } else packageModel.chart = { file, name: 'chart.aff' };
            packageDirty = true;
            packageAnalysis = null;
            await refreshPackageAnalysis();
            renderRows();
          },
        });
        rows.append(chartRow.element);

        const background = createResourceRow({
          label: '背景图', hint: '包内 bg.jpg，可选。', accept: 'image/*', value: model.background,
          preview: model.background ? thumbImage('background', localUrl(model.background.file || new Blob([model.background.data], { type: 'image/jpeg' })), '当前背景图') : null,
          onChoose: files => { if (files[0]) { model.background = { file: files[0], name: 'bg.jpg' }; packageDirty = true; renderRows(); } },
          onRemove: () => { model.background = null; packageDirty = true; renderRows(); },
        });
        rows.append(background.element);

        const effect = createResourceRow({
          label: '演出效果', hint: '包内 effect.bin，可选。', accept: '.bin', value: model.effect,
          onChoose: files => { if (files[0]) { model.effect = { file: files[0], name: 'effect.bin' }; packageDirty = true; renderRows(); } },
          onRemove: () => { model.effect = null; packageDirty = true; renderRows(); },
        });
        rows.append(effect.element);

        const sfx = el('div', { class: 'resource-row' });
        const add = createFilePicker({ accept: '.wav,audio/wav', multiple: true, label: '添加音效', onFiles: files => {
          for (const file of files) model.sfx.push({ file, name: file.name });
          packageDirty = true; packageAnalysis = null; refreshPackageAnalysis(); renderRows();
        }});
        const list = el('div', { class: 'resource-sfx-list' });
        for (const [index, sound] of model.sfx.entries()) {
          const item = el('div', { class: 'resource-sfx-item' }, el('span', {}, `${sound.name}（${formatResourceSize(sound.data?.length || sound.file?.size || 0)}）`));
          const remove = el('button', { class: 'button small ghost', type: 'button' }, '删除');
          remove.addEventListener('click', () => { model.sfx.splice(index, 1); packageDirty = true; packageAnalysis = null; refreshPackageAnalysis(); renderRows(); });
          item.append(remove); list.append(item);
        }
        sfx.append(el('div', { class: 'resource-head' }, el('strong', {}, `天键音效${model.sfx.length ? `（${model.sfx.length} 个）` : ''}`), el('span', { class: 'resource-hint' }, '按文件名与 AFF 的 fx 字段对应，可添加或删除。')), el('div', { class: 'resource-actions' }, add.button, add.input), list);
        if (packageAnalysis?.missing.length) sfx.append(el('div', { class: 'callout warning' }, `AFF 引用了但包里没有：${packageAnalysis.missing.join('、')}`));
        if (packageAnalysis?.unused.length) sfx.append(el('p', { class: 'hint' }, `当前未被 AFF 引用：${packageAnalysis.unused.join('、')}`));
        rows.append(sfx);

        if (model.others.length) {
          rows.append(el('div', { class: 'resource-row' }, el('strong', {}, '其他包内文件'), el('p', { class: 'hint' }, model.others.map(item => item.name).join('、') + '（编辑时会原样保留）')));
        }
      }

      async function prepareMusicRange(file, automatic) {
        if (!file) return;
        const sequence = ++musicSequence;
        const buffer = await decodeAudio(file);
        if (sequence !== musicSequence) return;
        if (automatic || previewRange.end <= previewRange.start || previewRange.end > buffer.duration) {
          previewRange = defaultPreviewRange(buffer.duration);
          rangeDirty = true;
        }
        rangeEditor?.destroy();
        rangeEditor = createPreviewRangeEditor({
          buffer, ...previewRange,
          onChange: range => { previewRange = range; rangeDirty = true; updateResourceSummary(); },
        });
        renderRows();
      }

      async function ensureMusicSource(report) {
        if (draft.music) return draft.music;
        if (musicSource) return musicSource;
        report('读取原音乐');
        const bytes = await fetchBinary(level.musicUrl, { onProgress: ratio => report(`读取原音乐 ${Math.round(ratio * 100)}%`) });
        musicSource = new File([bytes], 'music.ogg', { type: 'audio/ogg' });
        return musicSource;
      }

      box.hasChanges = () => Boolean(draft.cover || draft.music || draft.video || draft.removeVideo || packageDirty || rangeDirty);
      box.preparePatch = async report => {
        const patch = {};
        // 不合规视频在上传之前就拦住：否则白传 chart/cover/music，重试还要再来一遍
        if (draft.video && videoProbe && !videoProbe.ok) throw new Error(videoProbe.reason);
        if (packageDirty) {
          const prepared = await prepareChartPackage(packageModel, report);
          patch.chartFileId = await uploadFile(prepared.blob, { fileType: 'chart', name: 'chart', onProgress: ratio => report(`上传谱面 ${Math.round(ratio * 100)}%`) });
        }
        // uploadResource 返回的是可直接并入 UpdateLevelRequest 的片段（{coverFileId: ...} 等），用 Object.assign 合并
        if (draft.cover) Object.assign(patch, await uploadResource('cover', draft.cover, report));
        if (draft.music) Object.assign(patch, await uploadResource('music', draft.music, report));
        if (draft.video) Object.assign(patch, await uploadResource('video', draft.video, report));
        if (draft.removeVideo && !draft.video) patch.removeVideo = true;

        if (draft.music || rangeDirty) {
          const source = await ensureMusicSource(report);
          Object.assign(patch, await uploadResource('preview', source, report, { previewRange }));
          patch.previewStart = previewRange.start;
          patch.previewEnd = previewRange.end;
        }
        return patch;
      };
      box.commit = () => {};
      return box;
    }

    /**
     * 合作者挂名。**纯署名，没有编辑权限**——这一点必须写在界面上，
     * 否则会有人以为挂名了就能一起改谱面。要真的交出控制权得用下面的转让。
     *
     * 邀请按身份 id（UID）定位对方，需要对方确认后才会出现在署名里。
     */
    function collaboratorSection(level) {
      const box = el('div', { class: 'collab-section' },
        el('h2', { class: 'section-title' }, '合作者'));
      const body = el('div', {});
      box.append(body);

      render(level.collaborators ?? []);

      function render(list) {
        clear(body);

        body.append(el('p', { class: 'hint', style: 'margin-top:0' },
          '给参与制作的人挂名，会显示在谱面详情里。挂名只是署名，' +
          '不会给对方编辑、替换资源或删除的权限。'));

        if (list.length) {
          const rows = el('div', { class: 'collab-list' });
          for (const person of list) rows.append(collabRow(person));
          body.append(rows);
        }

        body.append(inviteForm());
      }

      function collabRow(person) {
        const row = el('div', { class: 'collab-row' });
        const status = el('div', { class: 'callout', hidden: true });

        const role = el('input', { class: 'input', value: person.role || '', maxlength: '24' });
        const save = el('button', { class: 'button small', type: 'button' }, '改分工');
        const remove = el('button', { class: 'button small ghost', type: 'button' }, '移除');

        save.addEventListener('click', async () => {
          if (!role.value.trim()) return;
          save.disabled = true;
          try {
            await updateCollaboratorRole(level.id, person.profileId, role.value);
            showBox(status, '已更新。', 'success');
          } catch (error) {
            showBox(status, describeError(error), 'error');
          } finally {
            save.disabled = false;
          }
        });

        remove.addEventListener('click', async () => {
          if (!window.confirm(`移除「${displayName(person.nickname, person.isAnonymized)}」的挂名？`)) return;
          remove.disabled = true;
          try {
            await removeCollaborator(level.id, person.profileId);
            row.remove();
          } catch (error) {
            showBox(status, describeError(error), 'error');
            remove.disabled = false;
          }
        });

        row.append(
          el('div', { class: 'collab-who' },
            avatarImage(person.isAnonymized ? null : person.avatarUrl,
              displayName(person.nickname, person.isAnonymized),
              { size: 96, className: 'avatar avatar-sm' }),
            el('div', {},
              el('strong', {}, displayName(person.nickname, person.isAnonymized)),
              el('span', {}, 'UID ', copyableValue(String(person.profileId)))),
          ),
          el('div', { class: 'collab-actions' }, role, save, remove),
          status,
        );
        return row;
      }

      /**
       * 邀请表单。搜昵称只是**找 UID 的辅助**——后端收的仍然是 UID，昵称不唯一，
       * 所以结果里必须把 UID 摆出来让人自己认，也保留直接填 UID 这条路：
       * 重名的时候那是唯一可靠的定位方式。
       */
      function inviteForm() {
        const uid = el('input', { class: 'input', type: 'number', min: '1', placeholder: '对方的 UID' });
        const role = el('input', { class: 'input', maxlength: '24', placeholder: '分工，如 曲绘 / BGA / 测试' });
        const submit = el('button', { class: 'button', type: 'button' }, '发出邀请');
        const status = el('div', { class: 'callout', hidden: true });

        const search = el('input', {
          class: 'input', type: 'search', autocomplete: 'off',
          placeholder: `按昵称找人（至少 ${MIN_SEARCH_LENGTH} 个字）`,
        });
        const results = el('div', { class: 'user-picker-results', hidden: true });

        // 每敲一下就发一次请求的话，这个端点的 30 次/分钟很快就满了
        let searchTimer = null;
        let searchSeq = 0;

        function closeResults() {
          clear(results);
          results.hidden = true;
        }

        function pick(user) {
          uid.value = String(user.id);
          search.value = user.nickname;
          closeResults();
          role.focus();
        }

        async function runSearch(keyword) {
          const seq = ++searchSeq;
          let found;
          try {
            found = await searchUsers(keyword);
          } catch (error) {
            if (seq !== searchSeq) return;
            clear(results);
            results.hidden = false;
            results.append(el('p', { class: 'user-picker-empty' }, describeError(error)));
            return;
          }
          if (seq !== searchSeq) return;

          clear(results);
          results.hidden = false;
          if (!found.length) {
            results.append(el('p', { class: 'user-picker-empty' },
              '没有找到这个昵称。对方可以在自己的个人空间里看到 UID，直接填 UID 也行。'));
            return;
          }

          for (const user of found) {
            const option = el('button', { class: 'user-picker-option', type: 'button' },
              avatarImage(user.avatarUrl, user.nickname, { size: 96, className: 'avatar avatar-sm' }),
              el('span', { class: 'user-picker-name' }, user.nickname),
              // 昵称可能重名，UID 才是认人的依据，必须显示
              el('span', { class: 'user-picker-uid num' }, `UID ${user.id}`));
            option.addEventListener('click', () => pick(user));
            results.append(option);
          }
        }

        search.addEventListener('input', () => {
          clearTimeout(searchTimer);
          const keyword = search.value.trim();
          if (keyword.length < MIN_SEARCH_LENGTH) {
            searchSeq += 1;   // 作废还在路上的那次
            closeResults();
            return;
          }
          searchTimer = setTimeout(() => runSearch(keyword), 300);
        });

        submit.addEventListener('click', async () => {
          hideBox(status);
          if (!uid.value.trim() || !role.value.trim()) {
            return showBox(status, '请填写对方 UID 和分工', 'error');
          }
          submit.disabled = true;
          submit.textContent = '发送中…';
          try {
            await inviteCollaborator(level.id, uid.value, role.value);
            uid.value = '';
            role.value = '';
            search.value = '';
            closeResults();
            showBox(status, '邀请已发出，对方确认后才会出现在署名里。', 'success');
          } catch (error) {
            showBox(status, describeError(error), 'error');
          } finally {
            submit.disabled = false;
            submit.textContent = '发出邀请';
          }
        });

        return el('div', { class: 'collab-invite' },
          el('span', { class: 'label' }, '邀请合作者'),
          el('p', { class: 'hint' },
            '按昵称搜人，或者直接填对方的 UID（在对方的个人空间页面能看到）。'
            + '昵称可能重名，选之前认一下 UID。邀请发出后要等他自己确认。'),
          el('div', { class: 'user-picker' }, search, results),
          el('div', { class: 'collab-invite-row' }, uid, role, submit),
          status,
        );
      }

      return box;
    }

    /**
     * 转让所有权。用于多人合作时在成员之间移交，也用于代传后交还作者。
     *
     * 上传者就是所有者，所以转让之后自己对这张谱面的编辑、替换、删除权限
     * 立刻消失——文案上必须写死这一点。
     */
    function transferSection(level) {
      const box = el('div', { class: 'transfer-section' },
        el('h2', { class: 'section-title' }, '转让所有权'));

      const status = el('div', { class: 'callout', hidden: true });
      const codeSlot = el('div', {});

      const generate = el('button', { class: 'button', type: 'button' }, '生成转让码');
      const revoke = el('button', { class: 'button ghost', type: 'button' }, '撤销未领取的码');

      generate.addEventListener('click', async () => {
        if (!window.confirm(
          `生成「${level.levelName}」的转让码？\n\n` +
          '对方领取后这张谱面就归他所有，你将无法再编辑、替换资源或删除它。'
        )) return;

        if (!await ensureElevated(`为「${level.levelName}」生成转让码`)) return;

        hideBox(status);
        generate.disabled = true;
        generate.textContent = '生成中…';
        try {
          const result = await createLevelTransfer(level.id);
          clear(codeSlot);
          codeSlot.append(commandBlock(result.code,
            `把这串码发给对方，${formatDate(result.expiresAtUtc)}过期。` +
            '它只显示这一次，关掉页面就看不到了；重新生成会作废这一个。'));
          generate.textContent = '重新生成';
        } catch (error) {
          showBox(status, describeError(error), 'error');
          generate.textContent = '生成转让码';
        } finally {
          generate.disabled = false;
        }
      });

      revoke.addEventListener('click', async () => {
        hideBox(status);
        revoke.disabled = true;
        try {
          await revokeLevelTransfer(level.id);
          clear(codeSlot);
          showBox(status, '已撤销。之前发出的码不再有效。', 'success');
          generate.textContent = '生成转让码';
        } catch (error) {
          showBox(status, describeError(error), 'error');
        } finally {
          revoke.disabled = false;
        }
      });

      box.append(
        el('p', { class: 'hint', style: 'margin-top:0' },
          '生成一串码交给对方，对方领取后这张谱面就归他所有——包括编辑、替换资源和删除的权限。' +
          '多人合作时用它在成员之间移交，代传时用它把作品交还作者。'),
        el('div', { class: 'hero-actions', style: 'margin-top:14px' }, generate, revoke),
        codeSlot,
        status,
      );
      return box;
    }

    /** 删除是不可逆的，单独放一块并要求输入曲名确认。 */
    function dangerZone(level) {
      const box = el('div', { class: 'danger-zone' });
      const confirm = el('input', { class: 'input', placeholder: '输入曲名以确认删除' });
      const remove = el('button', { class: 'button danger', type: 'button', disabled: true }, '删除这张谱面');
      const status = el('div', { class: 'callout', hidden: true });

      confirm.addEventListener('input', () => {
        remove.disabled = confirm.value.trim() !== level.levelName;
      });

      remove.addEventListener('click', async () => {
        if (!await ensureElevated(`删除「${level.levelName}」`)) return;

        remove.disabled = true;
        remove.textContent = '删除中…';
        try {
          await deleteLevel(level.id);
          location.href = 'user.html';
        } catch (error) {
          showBox(status, describeError(error), 'error');
          remove.disabled = false;
          remove.textContent = '删除这张谱面';
        }
      });

      box.append(
        el('h2', { class: 'section-title' }, '危险操作'),
        el('div', { class: 'callout error' },
          el('strong', {}, '删除后无法恢复。'),
          el('p', {}, '谱面文件、所有人在这张谱面上的成绩和点赞都会一并删除。'),
        ),
        el('div', { class: 'field', style: 'margin-top:16px' }, confirm),
        remove,
        status,
      );
      return box;
    }

    function safeColor(value) {
      return /^#[0-9a-f]{6}$/i.test(value || '') ? value : '#4B65B0';
    }

    function renderError(title, detail) {
      clear(content);
      content.append(el('div', { class: 'card' },
        el('div', { class: 'empty' },
          el('h3', {}, title),
          el('p', {}, detail),
          el('p', { style: 'margin-top:16px' }, el('a', { href: 'index.html' }, '← 返回谱面库')),
        ),
      ));
    }
  </script>
</body>
