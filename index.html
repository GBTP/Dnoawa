<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>谱面库 · Anoawa 社区</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        Anoawa <small>社区</small>
      </a>
      <nav class="top-actions">
        <a class="top-link current" href="index.html">谱面库</a>
        <a class="top-link" href="upload.html">上传</a>
        <a class="top-link" href="user.html">我的空间</a>
        <a class="top-link" href="docs/index.html">使用指南</a>
        <button class="top-link" type="button" id="logout">退出</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <h1>谱面库</h1>
      <p id="greeting"></p>
    </div>

    <form class="toolbar" id="toolbar" role="search">
      <input class="input search" type="search" id="search" name="search"
             placeholder="搜索曲名、曲师、谱师、画师或标签" autocomplete="off">
      <select class="select" id="sort" aria-label="排序方式"></select>
      <select class="select" id="order" aria-label="排序方向">
        <option value="desc">降序</option>
        <option value="asc">升序</option>
      </select>
      <button class="button" type="submit">搜索</button>
    </form>

    <p class="result-meta" id="meta"></p>
    <div class="callout error" id="error" hidden></div>
    <div class="level-grid" id="grid"></div>

    <div class="pager" id="pager" hidden>
      <button class="button small" type="button" id="prev">← 上一页</button>
      <span class="page-info num" id="page-info"></span>
      <button class="button small" type="button" id="next">下一页 →</button>
    </div>
  </main>

  <script type="module">
    import { requireLogin, describeError, logout, getProfile } from './js/api.js';
    import { listLevels, SORT_OPTIONS, PAGE_SIZE } from './js/levels.js';
    import { levelCard } from './js/level-card.js';
    import {
      el, showBox, hideBox, clear,
    } from './js/ui.js';

    if (!requireLogin()) throw new Error('redirecting');

    document.getElementById('logout').addEventListener('click', logout);

    const nickname = getProfile().nickname;
    const greeting = document.getElementById('greeting');
    if (nickname) {
      greeting.append('欢迎回来，', el('a', { href: 'user.html' }, nickname));
    } else {
      greeting.textContent = '浏览社区上传的谱面';
    }

    // 与客户端对齐：ChartLibraryPage.cs:504 显式传 20，SDK 各方法默认值也是 20，
    // 后端 LevelQueryParams.PageSize 的默认同样是 20。常量定义在 levels.js，
    // 这里只引用，避免两处各写一个值以后漂开。

    const form = document.getElementById('search').form;
    const searchInput = document.getElementById('search');
    const sortSelect = document.getElementById('sort');
    const orderSelect = document.getElementById('order');
    const grid = document.getElementById('grid');
    const meta = document.getElementById('meta');
    const errorBox = document.getElementById('error');
    const pager = document.getElementById('pager');

    for (const option of SORT_OPTIONS) {
      sortSelect.append(el('option', { value: option.value }, option.label));
    }

    // 状态放 URL 里：刷新、前进后退、分享链接都能还原同一屏结果
    const state = readState();
    searchInput.value = state.search;
    sortSelect.value = state.sortBy;
    orderSelect.value = state.sortOrder;

    form.addEventListener('submit', event => {
      event.preventDefault();
      state.search = searchInput.value;
      state.page = 1;
      load();
    });
    for (const select of [sortSelect, orderSelect]) {
      select.addEventListener('change', () => {
        state.sortBy = sortSelect.value;
        state.sortOrder = orderSelect.value;
        state.page = 1;
        load();
      });
    }
    document.getElementById('prev').addEventListener('click', () => turnPage(-1));
    document.getElementById('next').addEventListener('click', () => turnPage(1));
    addEventListener('popstate', () => {
      Object.assign(state, readState());
      searchInput.value = state.search;
      sortSelect.value = state.sortBy;
      orderSelect.value = state.sortOrder;
      load({ push: false });
    });

    // ---------- 加载 ----------

    // 必须声明在首次 load() 之前：let 有暂时性死区，而 load() 第一行就读它。
    // 放在下面的话进页面首次加载会抛 ReferenceError，又因为 load 是 async，
    // 错误变成未处理的 rejection，页面上一片空白、控制台之外毫无提示——
    // 而点搜索时模块顶层已执行完，反而正常，症状会非常费解。
    let requestSeq = 0;

    load({ push: false });

    async function load({ push = true } = {}) {
      const seq = ++requestSeq;
      hideBox(errorBox);
      renderSkeletons();
      pager.hidden = true;
      meta.textContent = '';

      if (push) writeState();

      let result;
      try {
        result = await listLevels({ ...state, pageSize: PAGE_SIZE });
      } catch (error) {
        if (seq !== requestSeq) return;   // 已经有更新的请求发出去了，丢弃这次的结果
        clear(grid);
        showBox(errorBox, describeError(error), 'error');
        return;
      }
      if (seq !== requestSeq) return;

      render(result);
    }

    function render(result) {
      clear(grid);

      if (!result.items.length) {
        grid.append(el('div', { class: 'empty', style: 'grid-column:1/-1' },
          el('h3', {}, state.search ? '没有匹配的谱面' : '还没有谱面'),
          el('p', {}, state.search ? '换个关键词试试，搜索会匹配曲名、曲师、谱师、画师和标签。' : '等第一位谱师上传吧。'),
        ));
        return;
      }

      for (const level of result.items) grid.append(levelCard(level));

      const totalPages = Math.max(1, Math.ceil(result.totalCount / result.pageSize));
      meta.textContent = `共 ${result.totalCount} 张谱面`;

      if (totalPages > 1) {
        pager.hidden = false;
        document.getElementById('page-info').textContent = `${result.page} / ${totalPages}`;
        document.getElementById('prev').disabled = result.page <= 1;
        document.getElementById('next').disabled = result.page >= totalPages;
        state.totalPages = totalPages;
      }
    }

    function renderSkeletons() {
      clear(grid);
      // 数量与每页条数一致，加载完成时网格形状不会跳
      for (let i = 0; i < PAGE_SIZE; i += 1) {
        grid.append(el('div', { class: 'skeleton skeleton-card' }));
      }
    }

    function turnPage(delta) {
      const next = state.page + delta;
      if (next < 1 || (state.totalPages && next > state.totalPages)) return;
      state.page = next;
      load();
      scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ---------- URL 状态 ----------

    function readState() {
      const params = new URLSearchParams(location.search);
      const sortBy = params.get('sort') || 'created';
      return {
        search: params.get('q') || '',
        page: Math.max(1, Number.parseInt(params.get('page') || '1', 10) || 1),
        // 后端对无法识别的 sortBy 会静默落回 created，这里先挡一道，免得 UI 显示的和实际排序不一致
        sortBy: SORT_OPTIONS.some(o => o.value === sortBy) ? sortBy : 'created',
        sortOrder: params.get('order') === 'asc' ? 'asc' : 'desc',
        totalPages: 0,
      };
    }

    function writeState() {
      const params = new URLSearchParams();
      if (state.search.trim()) params.set('q', state.search.trim());
      if (state.page > 1) params.set('page', String(state.page));
      if (state.sortBy !== 'created') params.set('sort', state.sortBy);
      if (state.sortOrder !== 'desc') params.set('order', state.sortOrder);

      const query = params.toString();
      history.pushState(null, '', query ? `?${query}` : location.pathname);
    }
  </script>
</body>
</html>
