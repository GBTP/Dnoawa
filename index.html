<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>社区谱面库 · Anoawa</title>
  <meta name="description" content="浏览 Anoawa 社区玩家上传的谱面：搜索曲名、曲师与谱师，试听片段，查看排行榜。">
  <link rel="canonical" href="https://anoawa.cc/">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        Anoawa <small>社区</small>
      </a>
      <nav class="top-actions">
        <a class="top-link current" href="index.html">谱面库</a>
        <a class="top-link" href="upload.html">上传</a>
        <a class="top-link" href="user.html">我的空间</a>
        <a class="top-link" href="inbox.html">站内信<span class="top-badge num" id="inbox-badge" hidden></span></a>
        <a class="top-link" href="get.html">获取游戏</a>
        <a class="top-link" href="docs/index.html">使用指南</a>
        <button class="top-link" type="button" id="logout">退出</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <h1>谱面库</h1>
      <p id="greeting"></p>
    </div>

    <!--
      静态的站点介绍。存在的意义有两个：
      1. 爬虫和未登录访客拿到的原本是个空壳（谱面全靠登录后 JS 填），收录一个
         空页面等于让人搜进来就被踢到登录页；
      2. 新访客需要先知道这是什么、去哪拿游戏。
      登录用户看不到它——脚本里第一件事就是移除。
    -->
    <section class="intro-block" id="intro">
      <p class="lead">
        Anoawa 是一款基于 Arcaea 玩法的社区音乐游戏。玩家在这里上传自己制作的
        <code>.aff</code> 谱面，其他人可以下载、游玩并提交成绩。
      </p>
      <div class="intro-actions">
        <a class="button primary" href="get.html">获取游戏</a>
        <a class="button" href="login.html">登录后浏览谱面</a>
        <a class="button ghost" href="docs/index.html">使用指南</a>
      </div>
      <p class="intro-note">浏览与下载社区谱面需要登录账号。</p>
    </section>

    <div class="tabs" role="tablist" aria-label="浏览方式">
      <button class="tab" role="tab" id="tab-all" aria-selected="true">全部谱面</button>
      <button class="tab" role="tab" id="tab-hot" aria-selected="false">热门</button>
    </div>

    <div class="hot-periods" id="hot-periods" hidden role="group" aria-label="统计周期"></div>

    <form class="toolbar" id="toolbar" role="search">
      <input class="input search" type="search" id="search" name="search"
             placeholder="搜索曲名、曲师、谱师、画师或标签" autocomplete="off">
      <select class="select" id="sort" aria-label="排序方式"></select>
      <select class="select" id="order" aria-label="排序方向">
        <option value="desc">降序</option>
        <option value="asc">升序</option>
      </select>
      <button class="button" type="submit">搜索</button>
    </form>

    <p class="result-meta" id="meta"></p>
    <div class="callout" id="get-hint" hidden>
      <strong>谱面要在 Anoawa 客户端里游玩。</strong>
      <p>还没有装的话，先 <a href="get.html">获取游戏</a>；已经装了可以忽略这条。</p>
    </div>
    <div class="callout error" id="error" hidden></div>
    <div class="level-grid" id="grid"></div>

    <div class="pager" id="pager" hidden>
      <button class="button small" type="button" id="prev">← 上一页</button>
      <span class="page-info num" id="page-info"></span>
      <button class="button small" type="button" id="next">下一页 →</button>
    </div>
  </main>

  <script type="module">
    import { requireLogin, describeError, logout, getProfile } from './js/api.js';
    import { listLevels, getHotLevels, SORT_OPTIONS, PAGE_SIZE, HOT_PERIODS } from './js/levels.js';
    import { levelCard } from './js/level-card.js';
    import { refreshInboxBadge } from './js/inbox.js';
    import {
      el, showBox, hideBox, clear, formatCount,
    } from './js/ui.js';

    if (!requireLogin()) throw new Error('redirecting');

    // 登录用户不需要那段面向新访客的介绍
    document.getElementById('intro')?.remove();

    document.getElementById('logout').addEventListener('click', logout);

    // 未读角标只在这一页和「我的空间」拉：其余页面（上传、编辑）正在干活，
    // 不值得为一个数字各多发两个请求。失败时不显示，见 refreshInboxBadge 的注释。
    refreshInboxBadge(document.getElementById('inbox-badge'));

    const stored = getProfile();
    const greeting = document.getElementById('greeting');
    if (stored.nickname) {
      greeting.append('欢迎回来，', el('a', { href: 'user.html' }, stored.nickname));
      // 只有真的有多个身份时才提这回事——单身份用户不需要知道这个概念
      if (stored.profileCount > 1) {
        greeting.append(el('span', { class: 'profile-switch-hint' },
          ' · ', el('a', { href: 'user.html' }, '切换身份')));
      }
    } else {
      greeting.textContent = '浏览社区上传的谱面';
    }

    // 与客户端对齐：ChartLibraryPage.cs:504 显式传 20，SDK 各方法默认值也是 20，
    // 后端 LevelQueryParams.PageSize 的默认同样是 20。常量定义在 levels.js，
    // 这里只引用，避免两处各写一个值以后漂开。

    const form = document.getElementById('search').form;
    const searchInput = document.getElementById('search');
    const sortSelect = document.getElementById('sort');
    const orderSelect = document.getElementById('order');
    const grid = document.getElementById('grid');
    const meta = document.getElementById('meta');
    const errorBox = document.getElementById('error');
    const pager = document.getElementById('pager');

    for (const option of SORT_OPTIONS) {
      sortSelect.append(el('option', { value: option.value }, option.label));
    }

    const tabAll = document.getElementById('tab-all');
    const tabHot = document.getElementById('tab-hot');
    const periodBox = document.getElementById('hot-periods');
    const toolbar = document.getElementById('toolbar');

    // 状态放 URL 里：刷新、前进后退、分享链接都能还原同一屏结果
    const state = readState();
    searchInput.value = state.search;
    sortSelect.value = state.sortBy;
    orderSelect.value = state.sortOrder;

    for (const period of HOT_PERIODS) {
      const button = el('button', {
        class: 'period', type: 'button', dataset: { period: period.value },
      }, period.label);
      button.addEventListener('click', () => {
        state.period = period.value;
        load();
      });
      periodBox.append(button);
    }

    /** 全部谱面和热门是两套不同的取数与呈现，由 load() 按 state.view 分派。 */
    function paintView() {
      const isHot = state.view === 'hot';
      tabAll.setAttribute('aria-selected', String(!isHot));
      tabHot.setAttribute('aria-selected', String(isHot));
      periodBox.hidden = !isHot;
      // 热榜是后端算好的固定 Top 50，搜索、排序和分页都不适用
      toolbar.hidden = isHot;
      for (const button of periodBox.children) {
        button.classList.toggle('current', button.dataset.period === state.period);
      }
    }

    function selectView(view) {
      if (state.view === view) return;
      state.view = view;
      state.page = 1;
      load();
    }

    tabAll.addEventListener('click', () => selectView('all'));
    tabHot.addEventListener('click', () => selectView('hot'));

    form.addEventListener('submit', event => {
      event.preventDefault();
      state.search = searchInput.value;
      state.page = 1;
      load();
    });
    for (const select of [sortSelect, orderSelect]) {
      select.addEventListener('change', () => {
        state.sortBy = sortSelect.value;
        state.sortOrder = orderSelect.value;
        state.page = 1;
        load();
      });
    }
    document.getElementById('prev').addEventListener('click', () => turnPage(-1));
    document.getElementById('next').addEventListener('click', () => turnPage(1));
    addEventListener('popstate', () => {
      Object.assign(state, readState());
      searchInput.value = state.search;
      sortSelect.value = state.sortBy;
      orderSelect.value = state.sortOrder;
      load({ push: false });
    });

    // 客户端提示只显示给没关过它的人：老玩家不需要每次进来都被提醒一次
    const GET_HINT_KEY = 'anoawa.getHintDismissed';
    if (!localStorage.getItem(GET_HINT_KEY)) {
      const hint = document.getElementById('get-hint');
      const dismiss = el('button', { class: 'button small', type: 'button', style: 'margin-top:10px' }, '知道了');
      dismiss.addEventListener('click', () => {
        localStorage.setItem(GET_HINT_KEY, '1');
        hint.hidden = true;
      });
      hint.append(dismiss);
      hint.hidden = false;
    }

    // ---------- 加载 ----------

    // 必须声明在首次 load() 之前：let 有暂时性死区，而 load() 第一行就读它。
    // 放在下面的话进页面首次加载会抛 ReferenceError，又因为 load 是 async，
    // 错误变成未处理的 rejection，页面上一片空白、控制台之外毫无提示——
    // 而点搜索时模块顶层已执行完，反而正常，症状会非常费解。
    let requestSeq = 0;

    load({ push: false });

    async function load({ push = true } = {}) {
      const seq = ++requestSeq;
      hideBox(errorBox);
      paintView();
      renderSkeletons();
      pager.hidden = true;
      meta.textContent = '';

      if (push) writeState();

      try {
        if (state.view === 'hot') {
          const result = await getHotLevels(state.period);
          if (seq !== requestSeq) return;
          renderHot(result);
        } else {
          const result = await listLevels({ ...state, pageSize: PAGE_SIZE });
          if (seq !== requestSeq) return;
          render(result);
        }
      } catch (error) {
        if (seq !== requestSeq) return;   // 已经有更新的请求发出去了，丢弃这次的结果
        clear(grid);
        showBox(errorBox, describeError(error), 'error');
      }
    }

    /**
     * 热榜。后端固定返回 Top 50、不分页，所以不用分页器。
     *
     * item.playCount 是**所选周期内**的次数，和 item.level.playCount（历史累计）
     * 不是一回事——这里显示的是前者，卡片自己显示的是后者。
     */
    function renderHot(result) {
      clear(grid);

      if (!result.items.length) {
        grid.append(el('div', { class: 'empty', style: 'grid-column:1/-1' },
          el('h3', {}, '这个周期还没有游玩记录'),
          el('p', {}, '换个周期看看，或者去全部谱面里逛逛。'),
        ));
        return;
      }

      result.items.forEach((item, index) => {
        const card = levelCard(item.level);
        // 名次和周期内次数是热榜特有的信息，挂在卡片外层
        grid.append(el('div', { class: 'hot-slot' },
          el('span', { class: 'hot-rank num' }, `#${index + 1}`),
          card,
          el('span', { class: 'hot-plays' },
            el('span', { class: 'num' }, formatCount(item.playCount)),
            ' 次游玩'),
        ));
      });

      const label = HOT_PERIODS.find(p => p.value === state.period)?.label ?? '本周';
      meta.textContent = `${label}热度前 ${result.items.length} 名 · 按周期内游玩次数与曲目时长加权`;
    }

    function render(result) {
      clear(grid);

      if (!result.items.length) {
        grid.append(el('div', { class: 'empty', style: 'grid-column:1/-1' },
          el('h3', {}, state.search ? '没有匹配的谱面' : '还没有谱面'),
          el('p', {}, state.search ? '换个关键词试试，搜索会匹配曲名、曲师、谱师、画师和标签。' : '等第一位谱师上传吧。'),
        ));
        return;
      }

      for (const level of result.items) grid.append(levelCard(level));

      const totalPages = Math.max(1, Math.ceil(result.totalCount / result.pageSize));
      meta.textContent = `共 ${result.totalCount} 张谱面`;

      if (totalPages > 1) {
        pager.hidden = false;
        document.getElementById('page-info').textContent = `${result.page} / ${totalPages}`;
        document.getElementById('prev').disabled = result.page <= 1;
        document.getElementById('next').disabled = result.page >= totalPages;
        state.totalPages = totalPages;
      }
    }

    function renderSkeletons() {
      clear(grid);
      // 数量对齐实际会返回多少：全部谱面每页 20，热榜固定 Top 50。
      // 不一致的话加载完成时网格高度会跳一下。
      const count = state.view === 'hot' ? 50 : PAGE_SIZE;
      for (let i = 0; i < count; i += 1) {
        grid.append(el('div', { class: 'skeleton skeleton-card' }));
      }
    }

    function turnPage(delta) {
      const next = state.page + delta;
      if (next < 1 || (state.totalPages && next > state.totalPages)) return;
      state.page = next;
      load();
      scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ---------- URL 状态 ----------

    function readState() {
      const params = new URLSearchParams(location.search);
      const sortBy = params.get('sort') || 'created';
      const period = params.get('period') || 'week';
      return {
        view: params.get('view') === 'hot' ? 'hot' : 'all',
        // 后端 NormalizePeriod 对无法识别的值有自己的兜底，这里也挡一道保持 UI 一致
        period: HOT_PERIODS.some(p => p.value === period) ? period : 'week',
        search: params.get('q') || '',
        page: Math.max(1, Number.parseInt(params.get('page') || '1', 10) || 1),
        // 后端对无法识别的 sortBy 会静默落回 created，这里先挡一道，免得 UI 显示的和实际排序不一致
        sortBy: SORT_OPTIONS.some(o => o.value === sortBy) ? sortBy : 'created',
        sortOrder: params.get('order') === 'asc' ? 'asc' : 'desc',
        totalPages: 0,
      };
    }

    function writeState() {
      const params = new URLSearchParams();
      if (state.view === 'hot') {
        params.set('view', 'hot');
        if (state.period !== 'week') params.set('period', state.period);
        const query = params.toString();
        history.pushState(null, '', query ? `?${query}` : location.pathname);
        return;
      }
      if (state.search.trim()) params.set('q', state.search.trim());
      if (state.page > 1) params.set('page', String(state.page));
      if (state.sortBy !== 'created') params.set('sort', state.sortBy);
      if (state.sortOrder !== 'desc') params.set('order', state.sortOrder);

      const query = params.toString();
      history.pushState(null, '', query ? `?${query}` : location.pathname);
    }
  </script>
</body>
</html>
