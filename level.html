<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>谱面详情 · Anoawa 社区</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        Anoawa <small>社区</small>
      </a>
      <nav class="top-actions">
        <a class="top-link" href="index.html">谱面库</a>
        <a class="top-link" href="upload.html">上传</a>
        <a class="top-link" href="user.html">我的空间</a>
        <a class="top-link" href="get.html">获取游戏</a>
        <a class="top-link" href="docs/index.html">使用指南</a>
        <button class="top-link" type="button" id="logout">退出</button>
      </nav>
    </div>
  </header>

  <main class="page" id="main">
    <p class="result-meta"><a href="index.html">← 返回谱面库</a></p>
    <div id="content"></div>
  </main>

  <script type="module" src="js/nav.js"></script>
  <script type="module">
    import { requireLogin, describeError, logout, ApiError } from './js/api.js';
    import {
      getLevel, toggleLike, setFeedback, getLeaderboard, getAroundMe, getMyBest,
      getRatingCurve, COMBO_LABELS, STATUS_LABELS, LEADERBOARD_SIZE,
    } from './js/levels.js';
    import { difficultyTier } from './js/songlist.js';
    import { getMyProfile } from './js/users.js';
    import {
      el, clear, coverImage, applyTheme, formatCount, formatDuration, formatDate,
      displayName, showBox, avatarImage,
    } from './js/ui.js';
    import { createPreviewPlayer } from './js/audio.js';
    import {
      getTagDictionary, findTag, findCategory, tagName, categoryName, UNCATEGORIZED,
    } from './js/tags.js';

    if (!requireLogin()) throw new Error('redirecting');
    document.getElementById('logout').addEventListener('click', logout);

    const content = document.getElementById('content');
    const levelId = new URLSearchParams(location.search).get('id');

    if (!levelId || !/^\d+$/.test(levelId)) {
      renderError('链接不完整', '缺少谱面编号，请从谱面库进入。');
    } else {
      load(levelId);
    }

    async function load(id) {
      content.append(el('div', { class: 'skeleton', style: 'height:280px' }));

      let level;
      try {
        level = await getLevel(id);
      } catch (error) {
        clear(content);
        // 404 才是真没了；403 是存在但当前不可见（比如别人审核中的谱面），
        // 两者的文案不能混，否则用户会以为作品被删了
        if (error instanceof ApiError && error.status === 403) {
          renderError('暂时不可访问', '这张谱面可能正在审核中，只有上传者和管理员能看到。');
        } else if (error instanceof ApiError && error.isGone) {
          renderError('谱面不存在', '它可能已被上传者或管理员删除。');
        } else {
          renderError('加载失败', describeError(error));
        }
        return;
      }

      clear(content);
      renderLevel(level);
      // 必须在 renderLevel 之后：launch-hint 这个节点是 actions() 建出来的
      handleNoAppRedirect();
      loadLeaderboard(id);
      loadRatingCurve(id);
    }

    // ---------- 主体 ----------

    function renderLevel(level) {
      document.title = `${level.levelName} · Anoawa 社区`;

      const hero = el('section', { class: 'hero' });
      // --theme 设在共同父容器上：hero 和成绩-定数曲线 section 都要用谱面主题色
      applyTheme(content, level.themeColor);

      const cover = coverImage(level, { alt: `${level.levelName} 封面` });
      if (level.displayDifficulty) {
        const tier = difficultyTier(level.displayDifficulty);
        cover.append(el('span', {
          class: 'diff-badge',
          dataset: tier >= 0 ? { tier: String(tier) } : {},
        }, level.displayDifficulty));
      }

      const info = el('div', { class: 'hero-info' },
        level.status !== 'Approved'
          ? el('span', { class: `status-badge ${level.status.toLowerCase()}`, style: 'position:static;display:inline-block;margin-bottom:10px' },
              STATUS_LABELS[level.status] || level.status)
          : null,
        el('h1', {}, level.levelName),
        el('p', { class: 'hero-artist' }, level.composerName),
        el('p', { class: 'hero-charter' },
          `谱面 ${level.charterName}`,
          level.artistName ? ` · 曲绘 ${level.artistName}` : null),
        specRow(level),
        uploaderBlock(level),
        tagRow(level.tagIds),
        actions(level),
      );

      hero.append(el('div', { class: 'hero-layout' },
        el('div', { class: 'hero-cover' }, cover),
        info,
      ));
      content.append(hero);

      if (level.previewUrl) content.append(previewBlock(level));
      if (level.introduction?.trim()) {
        content.append(
          el('h2', { class: 'section-title' }, '简介'),
          el('div', { class: 'intro' }, level.introduction),
        );
      }

      content.append(
        el('h2', { class: 'section-title' }, '排行榜'),
        el('div', { id: 'board' }, el('div', { class: 'skeleton', style: 'height:120px' })),
      );

      content.append(
        el('h2', { class: 'section-title' }, '成绩-定数趋势'),
        el('div', { id: 'curve' }, el('div', { class: 'skeleton', style: 'height:220px' })),
      );
    }

    function specRow(level) {
      const items = [
        ['难度', level.displayDifficulty, true],
        ['BPM', level.bpm || String(level.baseBpm || ''), false],
        ['时长', formatDuration(level.durationSeconds), false],
        ['游玩', formatCount(level.playCount), false],
        ['赞', formatCount(level.likeCount), false],
        ['何意味', formatCount(level.whatCount), false],
        ['踩', formatCount(level.dislikeCount), false],
      ];

      return el('div', { class: 'spec-row' },
        items.filter(([, value]) => value).map(([label, value, accent]) =>
          el('span', { class: `spec${accent ? ' accent' : ''}` },
            el('span', { class: 'label' }, label),
            el('span', { class: 'value num' }, value),
          )),
      );
    }

    /**
     * 上传者。头像 + 昵称 + 上传时间，整块可点进对方的个人空间。
     *
     * 注销后留下的墓碑账号不做链接：那个页面没有任何内容，昵称和头像按后端约定
     * 也都不能用（uploaderIsAnonymized）。
     */
    function uploaderBlock(level) {
      const anonymized = Boolean(level.uploaderIsAnonymized);
      const name = displayName(level.uploaderNickname, anonymized);

      const inner = [
        avatarImage(anonymized ? null : level.uploaderAvatarUrl, name, { size: 96, className: 'avatar avatar-sm' }),
        el('div', {},
          el('div', { class: 'uploader-name' }, name),
          el('div', { class: 'uploader-time' },
            (level.collaborators?.length ?? 0) > 0
              ? '所有者'
              : `上传于 ${formatDate(level.createdAtUtc)}`),
        ),
      ];

      const cards = [
        anonymized
          ? el('div', { class: 'uploader-card is-anonymized' }, inner)
          : el('a', { class: 'uploader-card', href: `user.html?id=${level.uploaderId}` }, inner),
      ];

      // 合作者只在详情里有（列表和热榜恒为空数组），所以只有这一处渲染
      for (const person of level.collaborators ?? []) {
        cards.push(collaboratorCard(person));
      }

      return el('div', { class: 'uploader' },
        el('span', { class: 'label' }, cards.length > 1 ? '制作者' : '上传者'),
        el('div', { class: 'credit-list' }, cards),
      );
    }

    /**
     * 一个合作挂名。**纯署名，没有编辑权限**——所有权仍然只在上传者手上。
     * 视觉上和上传者用同一套卡片，靠 role 标签区分。
     */
    function collaboratorCard(person) {
      const anonymized = Boolean(person.isAnonymized);
      const name = displayName(person.nickname, anonymized);

      const inner = [
        avatarImage(anonymized ? null : person.avatarUrl, name, { size: 96, className: 'avatar avatar-sm' }),
        el('div', {},
          el('div', { class: 'uploader-name' }, name),
          el('div', { class: 'uploader-time' }, person.role || '合作者'),
        ),
      ];

      return anonymized
        ? el('div', { class: 'uploader-card is-anonymized' }, inner)
        : el('a', { class: 'uploader-card', href: `user.html?id=${person.profileId}` }, inner);
    }

    /**
     * 受控 tag：按类别分组展示，chip 可点击、跳到分类浏览（view=category&tag=N）。
     * 字典拉不到（网络挂了）或某个 id 已不在字典里（被管理员删掉/合并）就跳过——
     * 对齐客户端的做法，不渲染 `#id` 这种内部占位。tag 行异步填进 hero 的 info 区，
     * 不阻塞首屏。
     */
    function tagRow(tagIds) {
      if (!tagIds?.length) return null;
      const row = el('div', { class: 'tag-row' });
      getTagDictionary().then(dict => {
        if (!dict) return;
        // 按类别分组，组内保持 tagIds 的顺序（谱师自己挑的顺序）
        const byCategory = new Map();   // categoryId|null -> tag[]
        for (const id of tagIds) {
          const tag = findTag(dict, id);
          if (!tag) continue;
          const key = tag.categoryId ?? null;
          if (!byCategory.has(key)) byCategory.set(key, []);
          byCategory.get(key).push(tag);
        }
        // 组的顺序按字典里类别的顺序，其它组在最后
        const orderedKeys = (dict.categories ?? []).map(c => c.id).filter(id => byCategory.has(id));
        if (byCategory.has(null)) orderedKeys.push(null);

        for (const key of orderedKeys) {
          const tags = byCategory.get(key);
          const label = key === null ? UNCATEGORIZED : categoryName(dict, findCategory(dict, key));
          row.append(el('span', { class: 'tag-group-label eyebrow' }, label));
          for (const tag of tags) {
            row.append(el('a', {
              class: 'tag',
              href: `index.html?view=category&tag=${tag.id}`,
              title: `浏览所有「${tagName(dict, tag)}」谱面`,
            }, tagName(dict, tag)));
          }
        }
      }).catch(() => {});
      return row;
    }

    function actions(level) {
      // 三态评价：赞 / 何意味 / 踩。同值再发 = 取消，不同值 = 切换。
      // myFeedback 来自 LevelResponse（"Like"/"What"/"Dislike" 或 null）。
      // 必须游玩过才能评价（后端按 PlayRecords 判据），没玩过按钮置灰。
      const TYPES = [
        { key: 'Like',    icon: '♡', label: '赞',     count: () => level.likeCount },
        { key: 'What',    icon: '？', label: '何意味', count: () => level.whatCount },
        { key: 'Dislike', icon: '↓', label: '踩',     count: () => level.dislikeCount },
      ];

      const buttons = TYPES.map(t => el('button', {
        class: 'button feedback-button',
        type: 'button',
        dataset: { type: t.key },
      }));

      const paint = () => {
        buttons.forEach((btn, i) => {
          const t = TYPES[i];
          const active = level.myFeedback === t.key;
          btn.classList.toggle('active', active);
          btn.textContent = `${active ? t.icon : t.icon} ${t.label} ${formatCount(t.count())}`;
        });
      };
      paint();

      buttons.forEach(btn => btn.addEventListener('click', async () => {
        if (btn.disabled) return;
        const type = btn.dataset.type;
        buttons.forEach(b => b.disabled = true);
        try {
          const result = await setFeedback(level.id, type);
          level.myFeedback = result.myFeedback;
          level.likeCount = result.likeCount;
          level.whatCount = result.whatCount;
          level.dislikeCount = result.dislikeCount;
          paint();
        } catch (error) {
          showBox(document.getElementById('launch-hint'), describeError(error), 'error');
        } finally {
          buttons.forEach(b => b.disabled = false);
        }
      }));

      // 游玩资格：getMyBest 返回 null 说明没成绩（没玩过），评价按钮置灰。
      // 401（未登录）时也置灰——未登录必然没玩过。不阻塞首屏：按钮先画好，结果回来再禁用。
      getMyBest(level.id).then(result => {
        if (!result) disableFeedback('必须游玩后才能评价');
      }).catch(() => disableFeedback('必须游玩后才能评价'));

      function disableFeedback(title) {
        buttons.forEach(b => { b.disabled = true; b.title = title; });
      }

      const play = el('button', { class: 'button primary', type: 'button' }, '在 Anoawa 中游玩');
      play.addEventListener('click', () => launchClient(level.id));

      const actions = el('div', { class: 'hero-actions' }, play, ...buttons);

      // 编辑入口只对上传者和管理员显示。要拿 profile 里的 id 和 isAdmin，
      // 而 localStorage 里存的那份只有昵称和头像，所以得请求一次。
      // 后端的权限判断才是权威的（UpdateLevelAsync 会再查一次），
      // 这里只是不给无权的人看到入口。
      getMyProfile().then(profile => {
        if (level.uploaderId !== profile.id && !profile.isAdmin) return;
        actions.append(el('a', { class: 'button', href: `edit.html?id=${level.id}` }, '编辑信息'));
      }).catch(() => { /* 拿不到就不显示入口，后端那关照样挡得住 */ });

      const fallback = el('div', { class: 'callout warning launch-fallback', id: 'launch-hint', hidden: true });

      return el('div', {},
        actions,
        fallback,
        // 刻意不提供谱面包下载：游戏那边压根没有导出谱面的入口，就是为了防止作品被
        // 改名或二次分发，网页上放裸下载会绕过这套保护。
      );
    }

    function previewBlock(level) {
      return el('div', { class: 'preview-block' },
        el('h2', { class: 'section-title', style: 'margin-top:0' }, '试听'),
        createPreviewPlayer(level.previewUrl),
        el('p', { class: 'hint' }, '30 秒左右的片段，与游戏内选曲界面听到的是同一段。'),
      );
    }

    // ---------- 拉起客户端 ----------

    /**
     * 客户端注册的是自定义 scheme anoawa://level/{id}（Android 在 AndroidManifest 的
     * intent-filter，iOS 在 Info.plist 的 CFBundleURLTypes）。
     *
     * 三个平台三种打法，因为失败时能拿到的反馈完全不同：
     *
     * - Android 用 intent:// 而不是 anoawa://。Chrome 对没有处理者的自定义 scheme 是**静默
     *   失败**——不跳转、不报错、也不触发任何事件，页面完全察觉不到。intent:// 带
     *   browser_fallback_url 就变成确定行为：装了就开，没装就跳到 fallback。
     * - iOS 只能用 anoawa://。没装应用时 Safari 会弹一次系统提示框，这是 custom scheme
     *   的固有行为，绕不过去（真正的解法是 Universal Links，要 associated-domains
     *   entitlement 和托管 apple-app-site-association，现在还没做）。
     * - 桌面**不尝试**唤起。Windows 版还没注册 scheme（Unity Standalone 不支持 deep link，
     *   得走注册表 + 单实例），试了只会让浏览器弹一个"无法打开 anoawa://"的系统框，
     *   不如直接说明。
     */
    const UA = navigator.userAgent;
    // iPadOS 13 起 Safari 默认把自己报成 Macintosh，只看 UA 会把 iPad 当桌面，靠触摸点数补一刀
    const IS_IOS = /iphone|ipad|ipod/i.test(UA) || (/macintosh/i.test(UA) && navigator.maxTouchPoints > 1);
    const IS_ANDROID = /android/i.test(UA);
    const ANDROID_PACKAGE = 'com.inokana.Anoawa';

    function launchClient(id) {
      const hint = document.getElementById('launch-hint');
      hint.hidden = true;

      if (!IS_ANDROID && !IS_IOS) {
        showLaunchHint('desktop');
        return;
      }

      // 跳走之后页面会失去焦点，用这个判断有没有被接走。
      // Android 走 intent:// 时通常轮不到它（要么开应用要么跳 fallback），但不是所有
      // Android 浏览器都认 intent://（Firefox、部分 App 内置 WebView 就不认），
      // 那种情况下什么都不会发生，得靠这个兜底。
      let left = false;
      const onHide = () => { if (document.hidden) left = true; };
      document.addEventListener('visibilitychange', onHide);
      addEventListener('blur', onHide, { once: true });

      if (IS_ANDROID) {
        const back = new URL(location.href);
        back.searchParams.set('id', id);
        back.searchParams.set('noapp', '1');
        location.href = `intent://level/${id}#Intent;scheme=anoawa;package=${ANDROID_PACKAGE};`
          + `S.browser_fallback_url=${encodeURIComponent(back.href)};end`;
      } else {
        location.href = `anoawa://level/${id}`;
      }

      setTimeout(() => {
        document.removeEventListener('visibilitychange', onHide);
        if (left) return;
        showLaunchHint('failed');
      }, 1400);
    }

    /**
     * @param {'failed'|'notinstalled'|'desktop'} kind
     *   failed —— 试过了但没被接走，装没装都有可能
     *   notinstalled —— Android 的 intent:// 明确跳回了 fallback，可以断定没装
     *   desktop —— 压根没试
     */
    function showLaunchHint(kind) {
      const hint = document.getElementById('launch-hint');
      if (!hint) return;

      // showBox 会覆写 className（点赞失败的提示共用这个节点），这里显式写回来
      hint.className = 'callout warning launch-fallback';
      clear(hint);

      if (kind === 'desktop') {
        hint.append(
          el('strong', {}, '桌面版暂不支持从网页唤起。'),
          el('p', {}, '在 Anoawa 里打开「谱面库 → 在线」搜索曲名就能找到这张谱面。'),
          el('p', {}, el('a', { href: 'get.html' }, '还没有游戏？获取 Anoawa →')),
        );
      } else if (kind === 'notinstalled') {
        hint.append(
          el('strong', {}, '这台设备上没有找到 Anoawa。'),
          el('p', {}, '安装包在社区群里发布，装完再回到这一页点「在 Anoawa 中游玩」即可。'),
          el('p', {}, el('a', { href: 'get.html' }, '获取 Anoawa →')),
        );
      } else {
        hint.append(
          el('strong', {}, '没能唤起 Anoawa。'),
          // 装了却没反应，最常见的原因是客户端版本早于支持链接跳转的那版。
          // 不写死版本号：这一页和客户端不同步发版，写了迟早对不上。
          el('p', {}, '已经装了游戏的话，多半是版本太旧，去群里拿一份最新安装包。'),
          el('p', {}, '也可以直接在游戏里打开「谱面库 → 在线」搜索曲名。'),
          el('p', {}, el('a', { href: 'get.html' }, '还没有游戏？获取 Anoawa →')),
        );
      }
      hint.hidden = false;
    }

    /**
     * Android 的 intent:// 没装应用时会跳回带 noapp=1 的本页。把提示亮出来，
     * 并且**把参数从地址栏抹掉**——不抹的话刷新或分享这个链接都会莫名其妙带着提示。
     */
    function handleNoAppRedirect() {
      const params = new URLSearchParams(location.search);
      if (params.get('noapp') !== '1') return;

      params.delete('noapp');
      const query = params.toString();
      history.replaceState(null, '', query ? `?${query}` : location.pathname);

      showLaunchHint('notinstalled');
      document.getElementById('launch-hint')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    // ---------- 排行榜 ----------

    /**
     * 排行榜。Top 100，和客户端 LeaderboardPanel 一致。
     *
     * 一次拿 100 条塞进一个限高的滚动区，而不是分页——排行榜是用来上下扫的，
     * 翻页会打断这件事。100 条的 DOM 量很小，不值得上虚拟滚动。
     */
    async function loadLeaderboard(id) {
      const box = document.getElementById('board');
      if (!box) return;

      // 两个请求一起发：榜单是所有人的，my-best 是我自己的，互不依赖
      const [boardResult, mineResult] = await Promise.allSettled([
        getLeaderboard(id, { pageSize: LEADERBOARD_SIZE }),
        getMyBest(id),
      ]);

      clear(box);

      if (boardResult.status === 'rejected') {
        box.append(el('div', { class: 'callout error' }, describeError(boardResult.reason)));
        return;
      }

      const result = boardResult.value;
      // my-best 没打过时返回 null；请求本身失败也当作没有，不打扰
      const mine = mineResult.status === 'fulfilled' ? mineResult.value : null;

      if (!result.items.length) {
        box.append(el('div', { class: 'empty' },
          el('h3', {}, '还没有成绩'),
          el('p', {}, '成为第一个通关的人。'),
        ));
        return;
      }

      // 榜上有别人、但自己没有已上传成绩：可能真没打过，也可能只是离线打的。
      // 不说清楚的话，离线玩家会以为自己的成绩丢了。
      if (!mine) {
        box.append(el('div', { class: 'my-score is-empty' },
          el('span', { class: 'label' }, '我已上传的成绩'),
          el('p', { class: 'my-hint' },
            '你还没有联网提交过这张谱面的成绩。离线游玩、开启 Mod 或练习模式的成绩不会上传。'),
        ));
      }

      // "我的最佳在不在这 100 名里"要直接查榜单，不能用 mine.rank 推算——
      // 两个端点算 rank 的方式不一样：榜单是 startRank + i（按排序位置数下来），
      // my-best 是 CountAsync(Score > 我的分) + 1（同分并列）。同分时两者给出的
      // 名次不同，拿 my-best 的名次去和榜单长度比会误判。
      const onBoard = mine ? result.items.some(item => item.userId === mine.userId) : false;

      // 自己的成绩固定在顶部，不用在榜里翻
      if (mine) box.append(myScoreRow(mine, id, onBoard, result.items.length));

      const scroller = el('div', { class: 'board-scroll' });
      const board = el('div', { class: 'board' });
      for (const score of result.items) {
        board.append(scoreRow(score, mine));
      }
      scroller.append(board);
      box.append(scroller);

      const foot = el('div', { class: 'board-foot' });
      foot.append(el('span', {},
        result.totalCount > result.items.length
          ? `共 ${result.totalCount} 条成绩，显示前 ${result.items.length} 名`
          : `共 ${result.items.length} 条成绩`));

      // 不在这 100 名里时给个入口，跳到自己周围那一段
      if (mine && !onBoard) {
        const jump = el('button', { class: 'button small', type: 'button' }, '看我附近的排名');
        jump.addEventListener('click', () => loadAroundMe(id, box, mine));
        foot.append(jump);
      }
      box.append(foot);

      // 自己在榜内的话滚到那一行，省得手动找
      const own = board.querySelector('.board-row.is-me');
      if (own) own.scrollIntoView({ block: 'center' });
    }

    /** 换成"我附近"的视图：以自己为中心的一段。 */
    async function loadAroundMe(id, box, mine) {
      clear(box);
      box.append(el('div', { class: 'skeleton', style: 'height:120px' }));

      let result;
      try {
        result = await getAroundMe(id, { range: LEADERBOARD_SIZE });
      } catch (error) {
        clear(box);
        box.append(el('div', { class: 'callout error' }, describeError(error)));
        return;
      }

      clear(box);
      // myRank 为 0 表示没有成绩，此时 items 也是空的
      if (!result.myRank || !result.items.length) {
        box.append(el('div', { class: 'empty' }, el('h3', {}, '你还没有这张谱面的成绩')));
        return;
      }

      // around-me 的 items 是以我为中心的，我必定在里面，不用提示"未上榜"
      box.append(myScoreRow(result.myScore ?? mine, id, true));

      const scroller = el('div', { class: 'board-scroll' });
      const board = el('div', { class: 'board' });
      for (const score of result.items) board.append(scoreRow(score, result.myScore));
      scroller.append(board);
      box.append(scroller);

      const back = el('button', { class: 'button small', type: 'button' }, '← 回到 Top 100');
      back.addEventListener('click', () => {
        clear(box);
        box.append(el('div', { class: 'skeleton', style: 'height:120px' }));
        loadLeaderboard(id);
      });
      box.append(el('div', { class: 'board-foot' },
        el('span', {}, `你排在第 ${result.myRank} 名`), back));

      board.querySelector('.board-row.is-me')?.scrollIntoView({ block: 'center' });
    }

    /** 榜单里的一行。mine 用来判断是不是自己，高亮那一行。 */
    function scoreRow(score, mine) {
      const combo = ({ PureMemory: 'pm', FullRecall: 'fr', TrackComplete: 'tc' })[score.comboState] || 'tc';
      const isMe = mine && score.userId === mine.userId;

      return el('div', { class: `board-row${isMe ? ' is-me' : ''}` },
        el('span', { class: 'board-rank num' }, `#${score.rank}`),
        score.isAnonymized
          ? el('span', { class: 'board-name anonymized' }, displayName(score.nickname, true))
          : el('a', { class: 'board-name', href: `user.html?id=${score.userId}` },
              displayName(score.nickname, false)),
        el('span', { class: `board-combo ${combo}` }, COMBO_LABELS[score.comboState] || ''),
        el('span', { class: 'board-score' }, score.score.toLocaleString('en-US')),
      );
    }

    /**
     * 固定在榜单上方的自己那条。
     *
     * **这里显示的是"已上传的最好成绩"，不是玩家真正的最好成绩。** 客户端存两套：
     * 本地 SQLite 的 ScoreRow（离线打的也记）和服务端的 PlayRecords（只有联网
     * 提交过的）。网页读不到手机上的本地库，所以只能看到后者。
     *
     * 差异的来源不止离线——开 Mod 的局和练习模式本来就不上传成绩（见
     * Anoawa/CLAUDE.md 的 Mod 设置一节）。所以标题不能写"我的最好成绩"，
     * 那会让人以为自己离线打的那次丢了。
     *
     * @param {boolean} [onBoard] 是否出现在下方榜单里
     * @param {number} [boardSize] 榜单实际显示了多少条
     */
    function myScoreRow(score, levelId, onBoard, boardSize) {
      const combo = ({ PureMemory: 'pm', FullRecall: 'fr', TrackComplete: 'tc' })[score.comboState] || 'tc';

      return el('div', { class: 'my-score' },
        el('span', { class: 'label' }, '我已上传的成绩'),
        el('div', { class: 'my-score-body' },
          el('span', { class: 'my-rank num' }, `#${score.rank}`),
          el('span', { class: 'my-value num' }, score.score.toLocaleString('en-US')),
          el('span', { class: `board-combo ${combo}` }, COMBO_LABELS[score.comboState] || ''),
          el('span', { class: 'my-judge num' },
            `${score.maxPureCount}/${score.pureCount}/${score.farCount}/${score.lostCount}`),
        ),
        onBoard === false && boardSize
          ? el('p', { class: 'my-note' }, `未进入下方的前 ${boardSize} 名`)
          : null,
        el('p', { class: 'my-hint' },
          '只统计联网提交的成绩。离线游玩、开启 Mod 或练习模式的成绩不会上传，' +
          '游戏内看到的最好成绩可能比这里高。'),
      );
    }

    // ---------- 成绩-定数趋势曲线 ----------

    const CURVE_VW = 720;
    const CURVE_VH = 240;
    const CURVE_ML = 46;   // 左留白：Y 轴标签
    const CURVE_MR = 12;
    const CURVE_MT = 12;
    const CURVE_MB = 28;   // 下留白：X 轴标签
    const SVG_NS = 'http://www.w3.org/2000/svg';

    function svgEl(tag, attrs = {}, text = '') {
      const node = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
      if (text) node.textContent = text;
      return node;
    }

    /**
     * 成绩-定数趋势曲线。数据已由后端预聚合（800W+ 且投过票的玩家，1W 分档取中位数），
     * 这里只负责把点画成一条折线。全站第一张图，SVG 无依赖、用谱面自己的 --theme 色。
     */
    async function loadRatingCurve(id) {
      const box = document.getElementById('curve');
      if (!box) return;

      let curve;
      try {
        curve = await getRatingCurve(id);
      } catch (error) {
        clear(box);
        box.append(el('div', { class: 'callout error' }, describeError(error)));
        return;
      }

      clear(box);
      if (!curve.points.length) {
        box.append(el('div', { class: 'empty' },
          el('h3', {}, '还没有足够数据'),
          el('p', {}, '暂无 800 万以上且投过定数的玩家数据。'),
        ));
        return;
      }

      box.append(renderCurve(curve));
    }

    function renderCurve(curve) {
      const points = curve.points;
      // curve 类不能少：app.css 里 .curve-grid-line / .curve-dot 等都是 .curve 后代选择器，
      // 没有它 SVG 子元素全走默认值（stroke:none / fill:black），在暗色背景上整块漆黑。
      const wrap = el('div', { class: 'curve curve-wrap' });
      const tooltip = el('div', { class: 'curve-tooltip' });
      wrap.append(tooltip);

      const svg = svgEl('svg', {
        viewBox: `0 0 ${CURVE_VW} ${CURVE_VH}`,
        role: 'img',
        'aria-label': '成绩-定数趋势图',
      });
      wrap.append(svg);

      const plotW = CURVE_VW - CURVE_ML - CURVE_MR;
      const plotH = CURVE_VH - CURVE_MT - CURVE_MB;
      const minScore = curve.minScore;
      // 防止所有成绩都落在下界同一档时 maxScore == minScore → X 轴除零；给一个桶宽的跨度兜底
      const maxScore = Math.max(curve.maxScore, minScore + 10_000);

      // Y 轴范围：数据中位数的范围上下各留一档，夹到 0~20（定数语义上界）
      const meds = points.map(p => p.median);
      let yMin = Math.max(0, Math.floor(Math.min(...meds)) - 1);
      let yMax = Math.min(20, Math.ceil(Math.max(...meds)) + 1);
      if (yMax - yMin < 1) { yMin = Math.max(0, yMin - 1); yMax = Math.min(20, yMax + 1); }
      const ySpan = Math.max(yMax - yMin, 1e-9);

      const xOf = (score) => CURVE_ML + (score - minScore) / (maxScore - minScore) * plotW;
      const yOf = (median) => CURVE_MT + (1 - (median - yMin) / ySpan) * plotH;

      // Y 轴网格 + 标签（灰阶，隔几个整数一条，避免太密）
      const yTickStep = Math.max(1, Math.ceil((yMax - yMin) / 5));
      for (let v = yMin; v <= yMax; v += yTickStep) {
        const y = yOf(v);
        svg.append(svgEl('line', {
          x1: CURVE_ML, y1: y, x2: CURVE_VW - CURVE_MR, y2: y,
          class: 'curve-grid-line',
        }));
        svg.append(svgEl('text', {
          x: CURVE_ML - 6, y: y + 4, 'text-anchor': 'end', class: 'curve-grid-label',
        }, String(v)));
      }

      // X 轴标签：下界 / 中值 / 上界
      const xTicks = [minScore, Math.round((minScore + maxScore) / 2 / 10000) * 10000, maxScore]
        .filter((v, i, a) => a.indexOf(v) === i);
      for (const v of xTicks) {
        svg.append(svgEl('text', {
          x: xOf(v), y: CURVE_VH - 8, 'text-anchor': 'middle', class: 'curve-axis-label',
        }, formatCount(v)));
      }

      // 折线
      const linePoints = points.map(p => `${xOf(p.scoreStart)},${yOf(p.median)}`).join(' ');
      if (points.length > 1) {
        svg.append(svgEl('polyline', { points: linePoints, class: 'curve-line' }));
      }

      // 每档一个点 + 一段透明 hover 命中区（占满档位 x 跨度、整高）
      points.forEach(p => {
        const x = xOf(p.scoreStart);
        svg.append(svgEl('circle', { cx: x, cy: yOf(p.median), r: 3, class: 'curve-dot' }));

        const xEnd = Math.min(xOf(p.scoreEnd + 1), CURVE_VW - CURVE_MR);
        const hit = svgEl('rect', {
          x: x, y: CURVE_MT, width: Math.max(xEnd - x, 1), height: plotH,
          fill: 'transparent', class: 'curve-hit',
        });
        hit.addEventListener('mousemove', (e) => {
          tooltip.textContent =
            `${p.scoreStart.toLocaleString('en-US')}–${p.scoreEnd.toLocaleString('en-US')} 分 · ` +
            `定数中位数 ${p.median.toFixed(1)} · ${p.playerCount} 人`;
          tooltip.style.display = 'block';
          const wr = wrap.getBoundingClientRect();
          let left = e.clientX - wr.left + 12;
          left = Math.min(left, wr.width - 140);
          tooltip.style.left = `${Math.max(left, 8)}px`;
          tooltip.style.top = `${e.clientY - wr.top + 12}px`;
        });
        hit.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
        svg.append(hit);
      });

      wrap.append(el('p', { class: 'curve-legend' },
        '横轴：最佳成绩（≥800W） · 纵轴：社区定数中位数 · 悬停查看档位详情'));

      return wrap;
    }

    // ---------- 错误页 ----------

    function renderError(title, detail) {
      clear(content);
      content.append(el('div', { class: 'card' },
        el('div', { class: 'empty' },
          el('h3', {}, title),
          el('p', {}, detail),
          el('p', { style: 'margin-top:16px' }, el('a', { href: 'index.html' }, '← 返回谱面库')),
        ),
      ));
    }
  </script>
</body>
