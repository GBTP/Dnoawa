<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>个人空间 · Anoawa 社区</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Anoawa <small>社区</small></a>
      <nav class="top-actions">
        <a class="top-link" href="index.html">谱面库</a>
        <a class="top-link" href="upload.html">上传</a>
        <a class="top-link current" href="user.html">我的空间</a>
        <a class="top-link" href="get.html">获取游戏</a>
        <a class="top-link" href="docs/index.html">使用指南</a>
        <button class="top-link" type="button" id="logout">退出</button>
      </nav>
    </div>
  </header>

  <main class="page" id="main">
    <div id="content"></div>
  </main>

  <script type="module">
    import {
      requireLogin, describeError, logout, ApiError, getToken, saveSession, clearSession,
    } from './js/api.js';
    import { deleteAccount, requestVerificationCode } from './js/auth.js';
    import {
      elevate, needsElevate, listProfiles, createProfile, issueProfileToken,
      deleteProfile, createTransfer, revokeTransfer, claimTransfer,
    } from './js/profiles.js';
    import {
      getMyProfile, getPublicUser, updateProfile,
      getMyLevels, getUserLevels, getRecentPlays,
    } from './js/users.js';
    import { levelCard } from './js/level-card.js';
    import { COMBO_LABELS } from './js/levels.js';
    import { uploadFile } from './js/tus.js';
    import { PRESET, processImage } from './js/media.js';
    import {
      el, clear, formatDate, displayName, showBox, hideBox, avatarImage, commandBlock,
    } from './js/ui.js';

    if (!requireLogin()) throw new Error('redirecting');
    document.getElementById('logout').addEventListener('click', logout);

    const content = document.getElementById('content');
    const requested = new URLSearchParams(location.search).get('id');

    if (requested !== null && !/^\d+$/.test(requested)) {
      renderError('链接不完整', '用户编号无效。');
    } else {
      load(requested === null ? null : Number(requested));
    }

    /** @param {?number} id null 表示看自己 */
    async function load(id) {
      content.append(el('div', { class: 'skeleton', style: 'height:180px' }));

      let profile;
      let isSelf = id === null;
      try {
        profile = isSelf ? await getMyProfile() : await getPublicUser(id);
        // 带着自己的 id 进来也算看自己，省得同一个人有两套界面
        if (!isSelf && profile.id === (await currentUserId())) isSelf = true;
      } catch (error) {
        clear(content);
        if (error instanceof ApiError && error.isGone) {
          renderError('用户不存在', '这个账号可能已经注销或被删除。');
        } else {
          renderError('加载失败', describeError(error));
        }
        return;
      }

      clear(content);
      renderProfile(profile, isSelf);
      loadLevels(profile.id, isSelf);
      loadPlays(isSelf ? null : profile.id);
    }

    let cachedId = null;
    async function currentUserId() {
      cachedId ??= (await getMyProfile()).id;
      return cachedId;
    }

    // ---------- 资料区 ----------

    function renderProfile(profile, isSelf) {
      const anonymized = Boolean(profile.isAnonymized);
      const name = displayName(profile.nickname, anonymized);
      document.title = `${name} · Anoawa 社区`;

      // /api/auth/profile 和 /api/auth/users/{id} 给的已经是 256px 缩略图，
      // avatarImage 里的拼接对带 query 的地址是幂等的
      const avatar = avatarImage(anonymized ? null : profile.avatarUrl, name, { size: 256 });

      const meta = el('div', { class: 'profile-meta' },
        el('h1', {}, name),
        el('p', { class: 'profile-sub num' }, `UID ${profile.id}`),
      );

      if (profile.isAdmin) meta.append(el('span', { class: 'role-badge' }, '管理员'));
      if (anonymized) {
        meta.append(el('p', { class: 'profile-sub' }, '该账号已注销，昵称与头像不再展示。'));
      }
      if (profile.bilibiliUid) {
        // 刻意不做成可点链接：这个 UID 谁都能填，后端既不校验格式也不验证归属。
        // 渲染成跳转 B 站空间的链接等于替一个未经验证的声明背书——填别人 UID
        // 的人会白得一个看起来很正规的入口。等有了真正的归属验证再放开。
        meta.append(el('p', { class: 'profile-sub' },
          `Bilibili UID ${profile.bilibiliUid} `,
          el('span', { class: 'unverified', title: '该 UID 由用户自行填写，未经验证' }, '未验证')));
      }
      if (isSelf && profile.email) {
        meta.append(el('p', { class: 'profile-sub' }, profile.email));
      }

      const header = el('section', { class: 'profile' }, avatar, meta);
      if (isSelf) header.append(editPanel(profile));
      content.append(header);
      if (isSelf) content.append(profilesPanel(profile));

      content.append(
        el('h2', { class: 'section-title' }, isSelf ? '我的谱面' : '上传的谱面'),
        isSelf
          ? el('p', { class: 'result-meta' },
              '有别人给你的转让码？',
              el('a', { href: 'claim.html' }, '领取一张谱面 →'))
          : null,
        el('div', { class: 'level-grid', id: 'levels' }),
        el('h2', { class: 'section-title' }, '最近游玩'),
        el('div', { id: 'plays' }, el('div', { class: 'skeleton', style: 'height:90px' })),
      );
    }

    // ---------- 编辑自己的资料 ----------

    function editPanel(profile) {
      const box = el('div', { class: 'profile-edit', hidden: true });
      const toggle = el('button', { class: 'button small', type: 'button' }, '编辑资料');

      const nickname = el('input', { class: 'input', maxlength: '24', value: profile.nickname ?? '' });
      const bilibili = el('input', { class: 'input', maxlength: '20', value: profile.bilibiliUid ?? '', placeholder: '纯数字 UID，留空即解绑' });
      const avatarInput = el('input', { type: 'file', accept: 'image/*', hidden: true });
      const avatarButton = el('button', { class: 'button small', type: 'button' }, '更换头像');
      const avatarName = el('span', { class: 'profile-sub' }, '未选择');
      const save = el('button', { class: 'button primary small', type: 'button' }, '保存');
      const status = el('div', { class: 'callout', hidden: true });

      avatarButton.addEventListener('click', () => avatarInput.click());
      avatarInput.addEventListener('change', () => {
        avatarName.textContent = avatarInput.files[0]?.name || '未选择';
      });

      toggle.addEventListener('click', () => {
        box.hidden = !box.hidden;
        toggle.textContent = box.hidden ? '编辑资料' : '收起';
      });

      save.addEventListener('click', async () => {
        hideBox(status);
        save.disabled = true;
        const original = save.textContent;
        save.textContent = '保存中…';

        try {
          const patch = {};
          const nextNickname = nickname.value.trim();
          if (nextNickname && nextNickname !== profile.nickname) patch.nickname = nextNickname;

          // 留空表示解绑，所以要和原值比较、允许提交空串
          const nextBilibili = bilibili.value.trim();
          if (nextBilibili !== (profile.bilibiliUid ?? '')) patch.bilibiliUid = nextBilibili;

          const file = avatarInput.files[0];
          if (file) {
            save.textContent = '处理头像…';
            // 头像后端会再生成 256px 缩略图，这里先压到 512 免得白传大图
            const blob = await processImage(file, { maxWidth: 512, maxHeight: 512, quality: 0.85 });
            save.textContent = '上传头像…';
            patch.avatarFileId = await uploadFile(blob, { fileType: 'avatar', name: 'avatar.jpg' });
          }

          if (!Object.keys(patch).length) {
            showBox(status, '没有需要保存的改动', '');
            return;
          }

          save.textContent = '保存中…';
          const updated = await updateProfile(patch);

          // 顶栏和谱面库的问候语读的是本地存档，一起更新
          saveSession(getToken(), {
            nickname: updated.nickname,
            avatarUrl: updated.avatarUrl,
          });
          showBox(status, '已保存，正在刷新…', 'success');
          setTimeout(() => location.reload(), 700);
        } catch (error) {
          showBox(status, describeError(error), 'error');
        } finally {
          save.disabled = false;
          save.textContent = original;
        }
      });

      box.append(
        el('div', { class: 'field' }, el('label', {}, '昵称'), nickname),
        el('div', { class: 'field' },
          el('label', {}, 'Bilibili UID'),
          bilibili,
          el('p', { class: 'hint' }, '目前不做归属验证，页面上会标注“未验证”。留空即解绑。')),
        el('div', { class: 'field' },
          el('label', {}, '头像'),
          el('div', { class: 'avatar-pick' }, avatarButton, avatarName, avatarInput)),
        save,
        status,
      );

      return el('div', { class: 'profile-actions' }, toggle, box);
    }

    /**
     * 用户数据（身份）管理。
     *
     * 一个账号可以有多个身份。这些端点全部收 accountToken，需要先用密码 elevate；
     * accountToken 只放内存（1 小时），刷新页面就要重新验证。
     */
    function profilesPanel(profile) {
      const box = el('section', { class: 'profiles-section' },
        el('h2', { class: 'section-title' }, '用户数据'));
      const body = el('div', { id: 'profiles-body' });
      box.append(body);

      renderLocked();

      function renderLocked() {
        clear(body);
        if (!needsElevate()) return renderList();

        const password = el('input', { class: 'input', type: 'password', autocomplete: 'current-password', placeholder: '账号密码' });
        const unlock = el('button', { class: 'button', type: 'button' }, '验证');
        const status = el('div', { class: 'callout', hidden: true });

        const submit = async () => {
          hideBox(status);
          if (!password.value) return;
          unlock.disabled = true;
          unlock.textContent = '验证中…';
          try {
            await elevate(password.value);
            password.value = '';
            renderList();
          } catch (error) {
            showBox(status, describeError(error), 'error');
            unlock.disabled = false;
            unlock.textContent = '验证';
          }
        };
        unlock.addEventListener('click', submit);
        password.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); submit(); }
        });

        body.append(
          el('p', { class: 'hint', style: 'margin-top:0' },
            '一个账号可以有多个用户数据（身份），用于开小号或代传谱面。查看和管理需要再验证一次密码。'),
          el('div', { class: 'input-row', style: 'max-width:340px;margin-top:12px' }, password, unlock),
          status,
        );
      }

      async function renderList() {
        clear(body);
        body.append(el('div', { class: 'skeleton', style: 'height:120px' }));

        let data;
        try {
          data = await listProfiles();
        } catch (error) {
          clear(body);
          // accountToken 过期会走到这，重新要求验证密码
          if (error instanceof ApiError && error.status === 401) return renderLocked();
          body.append(el('div', { class: 'callout error' }, describeError(error)));
          return;
        }

        clear(body);
        const list = el('div', { class: 'profile-list' });

        for (const item of data.items) {
          const isCurrent = item.id === profile.id;
          const row = el('div', { class: `profile-row${isCurrent ? ' is-current' : ''}` });

          const info = el('div', { class: 'profile-info' },
            el('strong', {}, item.nickname),
            el('span', {}, `${item.levelCount} 张谱面 · 创建于 ${formatDate(item.createdAtUtc)}`),
          );
          if (isCurrent) info.append(el('span', { class: 'current-tag' }, '当前使用中'));
          if (item.hasPendingTransfer) {
            info.append(el('span', { class: 'transfer-tag' },
              `转让码待领取，${formatDate(item.transferExpiresAtUtc)}过期`));
          }

          const actions = el('div', { class: 'profile-row-actions' });
          if (!isCurrent) {
            const use = el('button', { class: 'button small', type: 'button' }, '切换到此身份');
            use.addEventListener('click', () => switchTo(item));
            actions.append(use);
          }
          const manage = el('button', { class: 'button small ghost', type: 'button' }, '管理');
          manage.addEventListener('click', () => toggleManage(row, item, isCurrent));
          actions.append(manage);

          row.append(info, actions);
          list.append(row);
        }

        body.append(list);

        const foot = el('div', { class: 'profiles-foot' },
          el('span', {}, `${data.items.length} / ${data.maxPerAccount} 个身份`));

        if (data.items.length < data.maxPerAccount) {
          const create = el('button', { class: 'button small', type: 'button' }, '新建身份');
          create.addEventListener('click', () => showCreate(body));
          foot.append(create);
        }
        const claim = el('button', { class: 'button small', type: 'button' }, '用转让码领取');
        claim.addEventListener('click', () => showClaim(body));
        foot.append(claim);

        body.append(foot);
        body.append(transferGuide());
      }

      /**
       * 代传引导。**转让走的是整个身份**，所以必须让人明白不能用主号传完再转让——
       * 那等于把自己的成绩、点赞和全部作品一起送出去。这条不说清楚会出事。
       */
      function transferGuide() {
        return el('details', { class: 'transfer-guide' },
          el('summary', {}, '想帮别人代传谱面？先看这里'),
          el('div', { class: 'transfer-guide-body' },
            el('p', {}, el('strong', {}, '上传者就是谱面的所有者。')),
            el('p', {}, '用你自己的身份传别人的作品，那张谱面在系统里就归你——' +
              '编辑、替换资源、删除的权限都在你手上，作者本人反而动不了。'),
            el('p', {}, el('strong', {}, '所以代传一定要单独建一个身份：')),
            el('ol', {},
              el('li', {}, '新建一个身份，昵称用作者的名字'),
              el('li', {}, '切换到它，用它上传作者的谱面'),
              el('li', {}, '作者注册账号后，为这个身份生成转让码给他'),
              el('li', {}, '他在自己账号里用转让码领取，从此谱面归他'),
            ),
            el('p', { class: 'guide-warn' },
              '不要用常用身份代传，哪怕只有一张——转让走的是整个身份，' +
              '到时候没法只把那几张交出去。'),
            el('p', {},
              '如果只是多人合作时要把某一张谱面移交给同伴，用谱面自己的转让功能就行' +
              '（编辑页 → 转让所有权），不用动整个身份。'),
          ),
        );
      }

      async function switchTo(item) {
        if (!window.confirm(`切换到「${item.nickname}」？之后的上传和成绩都会记在这个身份下。`)) return;
        try {
          const result = await issueProfileToken(item.id);
          // 换掉落盘的 profileToken，否则后续请求还是以原身份发出
          saveSession(result.token, {
            nickname: result.profile.nickname,
            avatarUrl: result.profile.avatarUrl,
            activeProfileId: result.profile.id,
          });
          location.reload();
        } catch (error) {
          alert(describeError(error));
        }
      }

      function toggleManage(row, item, isCurrent) {
        const existing = row.nextElementSibling;
        if (existing?.classList.contains('profile-manage')) {
          existing.remove();
          return;
        }
        row.after(managePanel(item, isCurrent, renderList));
      }

      function showCreate(container) {
        const nickname = el('input', { class: 'input', maxlength: '24', placeholder: '新身份的昵称' });
        const submit = el('button', { class: 'button primary', type: 'button' }, '创建');
        const status = el('div', { class: 'callout', hidden: true });
        const panel = el('div', { class: 'inline-panel' },
          el('p', { class: 'hint', style: 'margin-top:0' }, '新身份从零开始，没有谱面和成绩。'),
          el('div', { class: 'input-row' }, nickname, submit),
          status);

        submit.addEventListener('click', async () => {
          if (!nickname.value.trim()) return;
          submit.disabled = true;
          try {
            await createProfile(nickname.value);
            renderList();
          } catch (error) {
            showBox(status, describeError(error), 'error');
            submit.disabled = false;
          }
        });
        container.append(panel);
        nickname.focus();
      }

      function showClaim(container) {
        const code = el('input', { class: 'input', placeholder: '粘贴转让码' });
        const submit = el('button', { class: 'button primary', type: 'button' }, '领取');
        const status = el('div', { class: 'callout', hidden: true });
        const panel = el('div', { class: 'inline-panel' },
          el('p', { class: 'hint', style: 'margin-top:0' },
            '领取后这个身份归你所有，它名下的谱面和成绩一并转移。'),
          el('div', { class: 'input-row' }, code, submit),
          status);

        submit.addEventListener('click', async () => {
          if (!code.value.trim()) return;
          submit.disabled = true;
          try {
            await claimTransfer(code.value);
            renderList();
          } catch (error) {
            showBox(status, describeError(error), 'error');
            submit.disabled = false;
          }
        });
        container.append(panel);
        code.focus();
      }

      return box;
    }

    /**
     * 单个身份的管理面板：转让码 + 删除。
     *
     * 当前正在使用的身份不能删也不能转让——把脚下的地板抽掉之后，
     * 手里的 profileToken 就失效了。要处理它得先切到别的身份。
     */
    function managePanel(item, isCurrent, refresh) {
      const box = el('div', { class: 'profile-manage' });
      const status = el('div', { class: 'callout', hidden: true });

      if (isCurrent) {
        box.append(
          el('p', { class: 'hint', style: 'margin-top:0' },
            '这是你当前使用的身份，不能转让或删除。要处理它，请先切换到别的身份。'),
        );
        return box;
      }

      // ---------- 转让 ----------
      const transferBox = el('div', { class: 'manage-block' },
        el('span', { class: 'label' }, '转让给他人'));

      if (item.hasPendingTransfer) {
        const revoke = el('button', { class: 'button small', type: 'button' }, '撤销转让码');
        revoke.addEventListener('click', async () => {
          revoke.disabled = true;
          try {
            await revokeTransfer(item.id);
            refresh();
          } catch (error) {
            showBox(status, describeError(error), 'error');
            revoke.disabled = false;
          }
        });
        transferBox.append(
          el('p', { class: 'hint' },
            `已有一个待领取的转让码，${formatDate(item.transferExpiresAtUtc)}过期。撤销后可以重新生成。`),
          revoke);
      } else {
        const generate = el('button', { class: 'button small', type: 'button' }, '生成转让码');
        const codeSlot = el('div', {});
        generate.addEventListener('click', async () => {
          if (!window.confirm(
            `生成「${item.nickname}」的转让码？\n\n拿到码的人可以把这个身份连同它的全部谱面、成绩、点赞领走，你将无法再访问。`
          )) return;
          generate.disabled = true;
          try {
            const result = await createTransfer(item.id);
            clear(codeSlot);
            // 明文只在这次响应里出现一次，之后再列身份只能看到有没有待领取的码
            codeSlot.append(commandBlock(result.code,
              `把这串码发给对方，${formatDate(result.expiresAtUtc)}过期。它只显示这一次，关掉就看不到了。`));
          } catch (error) {
            showBox(status, describeError(error), 'error');
            generate.disabled = false;
          }
        });
        transferBox.append(
          el('p', { class: 'hint' }, '生成一串码交给对方，对方在自己账号里领取后，这个身份就归他了。'),
          generate, codeSlot);
      }

      // ---------- 删除 ----------
      const scopes = [
        ['deleteLevels', '这个身份上传的谱面'],
        ['deleteLikes', '这个身份的点赞'],
        ['deletePlayRecords', '这个身份的成绩与游玩记录'],
      ];
      const checks = {};
      const scopeList = el('div', { class: 'scope-list' });
      for (const [key, label] of scopes) {
        const input = el('input', { type: 'checkbox' });
        checks[key] = input;
        scopeList.append(el('label', { class: 'scope-item' }, input,
          el('div', {}, el('strong', {}, `同时删除${label}`))));
      }

      const confirmName = el('input', { class: 'input', placeholder: `输入「${item.nickname}」以确认` });
      const remove = el('button', { class: 'button danger', type: 'button', disabled: true }, '删除这个身份');
      confirmName.addEventListener('input', () => {
        remove.disabled = confirmName.value.trim() !== item.nickname;
      });
      remove.addEventListener('click', async () => {
        remove.disabled = true;
        remove.textContent = '删除中…';
        try {
          await deleteProfile(item.id, {
            deleteLevels: checks.deleteLevels.checked,
            deleteLikes: checks.deleteLikes.checked,
            deletePlayRecords: checks.deletePlayRecords.checked,
          });
          refresh();
        } catch (error) {
          showBox(status, describeError(error), 'error');
          remove.disabled = false;
          remove.textContent = '删除这个身份';
        }
      });

      box.append(
        transferBox,
        el('div', { class: 'manage-block' },
          el('span', { class: 'label' }, '删除'),
          el('p', { class: 'hint' },
            '默认保留内容，改挂到「已注销用户」名下。勾选下面的项则一并删除。'),
          scopeList,
          el('div', { class: 'field', style: 'margin-top:12px' }, confirmName),
          remove),
        status,
      );
      return box;
    }

    /**
     * 注销账号。放在页面最下方的危险区，默认收起。
     *
     * 三个开关对应后端 DeleteAccountRequest 的三个字段。**默认全部保留**
     * （也就是三个都发 false），和后端"缺字段即全删"的默认相反——
     * 那个默认是为了兼容老客户端，对人来说保留才是安全的一侧。
     */
    function deletePanel(profile) {
      const box = el('div', { class: 'danger-zone' });
      const toggle = el('button', { class: 'button small danger', type: 'button' }, '注销账号');
      const panel = el('div', { class: 'delete-panel', hidden: true });

      toggle.addEventListener('click', () => {
        panel.hidden = !panel.hidden;
        toggle.textContent = panel.hidden ? '注销账号' : '收起';
      });

      const scopes = [
        ['deleteLevels', '我上传的谱面',
         '不删则改挂到「已注销用户」名下，其他玩家仍能下载游玩。'],
        ['deleteLikes', '我的点赞', '不删则保留，对应谱面的点赞数不变。'],
        ['deletePlayRecords', '我的成绩与游玩记录',
         '不删则改挂到「已注销用户」，仍会出现在排行榜上。'],
      ];

      const checks = {};
      const scopeList = el('div', { class: 'scope-list' });
      for (const [key, label, note] of scopes) {
        const input = el('input', { type: 'checkbox' });
        checks[key] = input;
        input.addEventListener('change', paintWarning);
        scopeList.append(el('label', { class: 'scope-item' },
          input,
          el('div', {},
            el('strong', {}, `同时删除${label}`),
            el('span', {}, note)),
        ));
      }

      // deleteLevels 的连带影响足够意外，勾上时单独警告
      const cascade = el('div', { class: 'callout warning', hidden: true });
      function paintWarning() {
        cascade.hidden = !checks.deleteLevels.checked;
        if (checks.deleteLevels.checked) {
          clear(cascade);
          cascade.append(
            el('strong', {}, '删除谱面会连带删掉别人的数据。'),
            el('p', {}, '其他玩家在你这些谱面上的成绩、点赞和游玩记录都会一并消失，包括你上面选择保留的部分。'),
          );
        }
      }

      const email = el('input', { class: 'input', type: 'email', value: profile.email ?? '', readonly: true });
      const code = el('input', { class: 'input code', maxlength: '6', inputmode: 'numeric', placeholder: '······' });
      const sendCode = el('button', { class: 'button small', type: 'button' }, '发送验证码');
      const confirm = el('input', { class: 'input', placeholder: '输入你的昵称以确认' });
      const submit = el('button', { class: 'button danger', type: 'button', disabled: true }, '永久注销账号');
      const status = el('div', { class: 'callout', hidden: true });

      const revalidate = () => {
        submit.disabled = !(code.value.trim().length >= 4 && confirm.value.trim() === profile.nickname);
      };
      code.addEventListener('input', revalidate);
      confirm.addEventListener('input', revalidate);

      sendCode.addEventListener('click', async () => {
        hideBox(status);
        sendCode.disabled = true;
        try {
          await requestVerificationCode(profile.email);
          let left = 60;
          const tick = setInterval(() => {
            left -= 1;
            sendCode.textContent = left > 0 ? `${left} 秒后重发` : '发送验证码';
            if (left <= 0) { clearInterval(tick); sendCode.disabled = false; }
          }, 1000);
          sendCode.textContent = '60 秒后重发';
          showBox(status, '验证码已发送到你的邮箱，10 分钟内有效。', 'success');
        } catch (error) {
          showBox(status, describeError(error), 'error');
          sendCode.disabled = false;
        }
      });

      submit.addEventListener('click', async () => {
        const kept = scopes.filter(([key]) => !checks[key].checked).map(([, label]) => label);
        const summary = kept.length
          ? `以下内容会改挂到「已注销用户」名下保留：${kept.join('、')}。`
          : '你选择了删除全部内容。';
        if (!window.confirm(`${summary}\n\n注销后无法恢复，确定继续吗？`)) return;

        submit.disabled = true;
        submit.textContent = '注销中…';
        try {
          await deleteAccount(code.value, {
            deleteLevels: checks.deleteLevels.checked,
            deleteLikes: checks.deleteLikes.checked,
            deletePlayRecords: checks.deletePlayRecords.checked,
          });
          // 账号没了，本地凭据也没有意义了
          clearSession();
          alert('账号已注销。');
          location.href = 'login.html';
        } catch (error) {
          showBox(status, describeError(error), 'error');
          submit.disabled = false;
          submit.textContent = '永久注销账号';
        }
      });

      panel.append(
        el('div', { class: 'callout error' },
          el('strong', {}, '注销后账号无法恢复。'),
          el('p', {}, '默认会保留你的谱面、点赞和成绩，改挂到「已注销用户」名下——昵称和头像不再展示，但内容仍留在社区里。想连内容一起删掉，勾选下面的选项。'),
        ),
        el('div', { class: 'field' }, el('label', {}, '删除范围'), scopeList),
        cascade,
        el('div', { class: 'field' }, el('label', {}, '邮箱'), email),
        el('div', { class: 'field' },
          el('label', {}, '验证码'),
          el('div', { class: 'input-row' }, code, sendCode)),
        el('div', { class: 'field' },
          el('label', {}, `输入昵称「${profile.nickname}」以确认`),
          confirm),
        submit,
        status,
      );

      box.append(el('h2', { class: 'section-title' }, '危险操作'), toggle, panel);
      return box;
    }

    // ---------- 谱面 ----------

    async function loadLevels(id, isSelf) {
      const box = document.getElementById('levels');
      try {
        const result = isSelf ? await getMyLevels() : await getUserLevels(id);
        clear(box);

        if (!result.items.length) {
          box.append(el('div', { class: 'empty', style: 'grid-column:1/-1' },
            el('h3', {}, '还没有上传过谱面'),
            isSelf ? el('p', {}, el('a', { href: 'upload.html' }, '上传第一张 →')) : null,
          ));
          return;
        }

        for (const level of result.items) {
          const card = levelCard(level);
          if (!isSelf) { box.append(card); continue; }

          // 自己的空间里给每张谱面一个编辑入口，省得先进详情再点一次。
          // 卡片本身是 <a>，<a> 里不能嵌 <a>（浏览器会把内层移出去），
          // 所以包一层容器，两个链接是兄弟节点。
          box.append(el('div', { class: 'card-slot' },
            card,
            el('a', { class: 'card-edit', href: `edit.html?id=${level.id}` }, '编辑'),
          ));
        }

        if (result.totalCount > result.items.length) {
          box.append(el('p', { class: 'result-meta', style: 'grid-column:1/-1;margin-top:8px' },
            `共 ${result.totalCount} 张，这里显示最近 ${result.items.length} 张`));
        }
      } catch (error) {
        clear(box);
        box.append(el('div', { class: 'callout error', style: 'grid-column:1/-1' }, describeError(error)));
      }
    }

    // ---------- 最近游玩 ----------

    async function loadPlays(id) {
      const box = document.getElementById('plays');
      try {
        const result = await getRecentPlays(id);
        clear(box);

        if (!result.items.length) {
          box.append(el('div', { class: 'empty' }, el('h3', {}, '还没有游玩记录')));
          return;
        }

        const list = el('div', { class: 'plays' });
        for (const play of result.items) {
          const combo = ({ PureMemory: 'pm', FullRecall: 'fr', TrackComplete: 'tc' })[play.comboState] || 'tc';
          list.append(el('a', { class: 'play-row', href: `level.html?id=${play.levelId}` },
            el('span', { class: 'play-name' },
              play.levelName,
              el('span', { class: 'play-diff num' }, play.displayDifficulty)),
            el('span', { class: `play-judge num` },
              `${play.maxPureCount}/${play.pureCount}/${play.farCount}/${play.lostCount}`),
            el('span', { class: `board-combo ${combo}` }, COMBO_LABELS[play.comboState] || ''),
            el('span', { class: 'play-score num' }, play.score.toLocaleString('en-US')),
            el('span', { class: 'play-time' }, formatDate(play.playedAtUtc)),
          ));
        }
        box.append(list);
        box.append(el('p', { class: 'result-meta', style: 'margin-top:10px' },
          '判定按 Max Pure / Pure / Far / Lost 排列。只包含联网提交的记录——' +
          '离线游玩、开启 Mod 或练习模式的成绩不会上传。'));
      } catch (error) {
        clear(box);
        box.append(el('div', { class: 'callout error' }, describeError(error)));
      }
    }

    function renderError(title, detail) {
      clear(content);
      content.append(el('div', { class: 'card' },
        el('div', { class: 'empty' },
          el('h3', {}, title),
          el('p', {}, detail),
          el('p', { style: 'margin-top:16px' }, el('a', { href: 'index.html' }, '← 返回谱面库')),
        ),
      ));
    }
  </script>
</body>
